# Implementation plan for SL-005 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-005"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable
# (`lib:reference/glossary.md` § reference forms). The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.
[[phase]]
id        = "PHASE-01"
name      = "Shared spend and the relaxed strip"
objective = "Move spend into utf8 as the one shared helper (design § 5.6, POL-001) and relax pii.strip in place to the six rules of design § 5.4 (DEC-043). The classify state's preprocessing is otherwise unchanged; tests that asserted the removed rules are re-pointed."
entrance_criteria = [
  { id = "EN-1", text = "SL-005 design is locked (run dr-01a1864d, revision 29); RV-019 concluded." },
]
exit_criteria = [
  { id = "EX-1", text = "utf8.spend(text, remaining) returns remaining minus the text's byte size, floored at 0; render.gleam and classify/state.gleam call it and define no spend of their own." },
  { id = "EX-2", text = "pii.strip applies, in order: forged markers removed; URL userinfo dropped; URL query or fragment replaced from the first ? or # up to the next whitespace, quote, < or > (?[…] / #[…]), path and port kept; [token] for a 20+ run of ASCII letters and digits holding both, matched only at a run's start; [ip]; protected dates and [number]." },
  { id = "EX-3", text = "The email rule, the [email]-host URL pass, the port pass, the /[…] remainder pass and their constants are gone; email addresses pass through unchanged." },
  { id = "EX-4", text = "A token holding 8+ digits strips to one [token]; a 16 KiB letter run and a 16 KiB digit run strip in well under a second." },
  { id = "EX-5", text = "just check is clean." },
]
verification = [
  { id = "VT-1", expects = "strip table: addresses kept, userinfo dropped, port and path kept, ?[…] and #[…], token keep/erase rows, token before the digit rule", test_file = "test/screwtape/pii_test.gleam", keywords = ["[token]", "?[…]", "#[…]", "/login-verify-account-2024"], waived = false },
  { id = "VT-2", expects = "the token rule stays linear on a long letter run", test_file = "test/screwtape/pii_test.gleam", keywords = ["linear"], waived = false },
  { id = "VT-3", expects = "spend is tested where it now lives", test_file = "test/screwtape/utf8_test.gleam", keywords = ["utf8.spend"], waived = false },
  { id = "VA-1", text = "grep finds exactly one fn spend (utf8.gleam) and no email_pattern, url_email_host, url_port or url_remainder constant in src." },
  { id = "VA-2", text = "Phase review (code-review, quotient pi reviewer) against design § 5.4; findings disposed before the next phase." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "The window"
objective = "Replace state.build with the window (design § 5.1, § 5.3; DEC-041, DEC-042): Mail carries the six address lists with names; state.window applies every bound to the raw text; state.encode is the one encoder; state is encode(window, pii.strip). The schema id becomes mail-2 with the preprocessing (DEC-035, DEC-044). The lines do not carry seen yet."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 is complete." },
]
exit_criteria = [
  { id = "EX-1", text = "input.Mail has from, sender, reply_to, to, cc and bcc as lists of {name: Option(String), email: String}, decoded from read's six lists in order; senders is gone. One address type serves input and the window (POL-001)." },
  { id = "EX-2", text = "state.window(mail) -> Window and state.encode(window, text: fn(String) -> String) -> Json exist; build is gone; encode passes every string value, and only string values, through text, in the field order of design § 5.2." },
  { id = "EX-3", text = "Every text: controls removed (U+0000–U+001F except tab, LF, CR; U+007F; U+202A–U+202E; U+2066–U+2069), cut with utf8.prefix, then the partial word dropped when cut here or on arrival, a whitespace-free prefix kept whole." },
  { id = "EX-4", text = "Address lists: at most 10 entries each in read order, not deduplicated; name cut to 128 bytes; an email over 254 bytes drops its entry; <list>_omitted counts dropped and overflow entries. Emails get control removal only." },
  { id = "EX-5", text = "Bodies: the first 10, against a 16,384-byte budget charged with utf8.spend on the seen text; is_truncated = read flag ∨ cut on arrival ∨ cut here; control removal alone is not truncation; a budget-spent body is text \"\" with is_truncated true when its input text was non-empty." },
  { id = "EX-6", text = "schema.id is mail-2 and schema.mail_1 is renamed mail_2; cli.classify_mail sends and prints encode(window(mail), pii.strip)." },
  { id = "EX-7", text = "The worst-case window's encoded state size (every field at its bound, text that placeholders lengthen) is computed by a test and pinned, and noted against ASM-006's 32k-token budget." },
  { id = "EX-8", text = "state_holds_only_the_contract_fields_test is a positive key-set test; just check is clean." },
]
verification = [
  { id = "VT-1", expects = "I1: for a mail exercising every field, state equals seen with pii.strip on each string (decode both, compare)", test_file = "test/screwtape/classify_state_test.gleam", keywords = ["state.window", "state.encode", "pii.strip"], waived = false },
  { id = "VT-2", expects = "window bounds: cut with word drop, whitespace-free prefix kept, body budget total, budget-spent bodies, cut on arrival, control removal not truncation", test_file = "test/screwtape/classify_state_test.gleam", keywords = ["whitespace_free", "budget", "is_truncated"], waived = false },
  { id = "VT-3", expects = "six lists in order, 10 kept, overflow and oversize emails counted, names cleaned of controls and bidi overrides", test_file = "test/screwtape/classify_state_test.gleam", keywords = ["reply_to_omitted", "bcc_omitted", "\\u{202E}"], waived = false },
  { id = "VT-4", expects = "the decoder reads all six lists with names", test_file = "test/screwtape/classify_input_test.gleam", keywords = ["reply_to", "bcc", "name"], waived = false },
  { id = "VT-5", expects = "the schema id is mail-2", test_file = "test/screwtape/classify_schema_test.gleam", keywords = ["\"mail-2\"", "mail_2"], waived = false },
  { id = "VT-6", expects = "worst-case encoded state size pinned (ASM-006)", test_file = "test/screwtape/classify_state_test.gleam", keywords = ["worst_case"], waived = false },
  { id = "VA-1", text = "grep finds no state.build, Mail.senders, sender_domains or mail_1 in src or test." },
  { id = "VA-2", text = "Phase review (code-review, quotient pi reviewer) against design § 5.1, § 5.3, § 5.6; findings disposed before the next phase." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "seen on the line, README, live probe"
objective = "Put seen on both classify lines (design § 5.2, § 5.5; DEC-040, DEC-041), building the window once per mail, and bring the README to the contract: Compatibility, classify, classify_state, mail-2, What Jev sees, Bounds (DEC-030). Close ASM-006 with a live probe."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 is complete." },
]
exit_criteria = [
  { id = "EX-1", text = "render.classify prints {id, cursor, schema, model, seen, answers}; render.classify_state prints {id, cursor, schema, seen, state}; cli.classify_mail calls state.window once and encodes it twice (identity for seen, pii.strip for state)." },
  { id = "EX-2", text = "README Compatibility says consumers check schema as well as version, and state and seen shapes change only with the schema." },
  { id = "EX-3", text = "README classify and classify_state document seen as the un-stripped window state was stripped from, printed like read's output; the field table replaces classify_state's state.* rows with its bounds stated for seen, and says placeholders may lengthen state texts." },
  { id = "EX-4", text = "README ### mail-1 is renamed ### mail-2 and holds only the questions table; docs_test reads ### mail-2." },
  { id = "EX-5", text = "README What Jev sees is rewritten for design § 5.4 and the egress (names, full addresses of all six lists, URL paths), listing the token rule's accepted misses; Bounds states the per-line ceiling (about 45 KB of seen; classify_state up to about 1.6 times that, per PHASE-02 EX-7)." },
  { id = "EX-6", text = "No sender_domains or mail-1 remains in README or src; TDD scaffolding pruned; just check is clean." },
]
verification = [
  { id = "VT-1", expects = "byte-exact classify and classify_state contract strings carry seen", test_file = "test/screwtape/render_test.gleam", keywords = ["\\\"seen\\\"", "classify_state"], waived = false },
  { id = "VT-2", expects = "end-to-end classify and classify --state lines carry seen and schema mail-2", test_file = "test/screwtape/cli_test.gleam", keywords = ["\\\"seen\\\"", "mail-2"], waived = false },
  { id = "VT-3", expects = "docs_test pins the ### mail-2 question table", test_file = "test/screwtape/docs_test.gleam", keywords = ["### mail-2", "mail_2"], waived = false },
  { id = "VA-1", text = "README review against EX-2..EX-5 and design § 5.2, § 5.4; phase review (code-review, quotient pi reviewer); findings disposed." },
  { id = "VH-1", text = "Live probe (ASM-006): one synthetic worst-case mail, hand-made and kept outside the repo (POL-002), through classify against Jev; operator records input tokens or jev_context in the notes." },
]
specs        = []
requirements = []
