# Implementation plan for SL-002 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-002"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable. Reference a criterion
# from another phase phase-qualified (PHASE-03/EX-8).

[[phase]]
id        = "PHASE-01"
name      = "Retention config"
objective = "Add window.retain_messages (DEC-024): decode, validate, carry it in window_json, and expose it as the Home Manager option window.retainMessages (design § 5.2 Configuration)."
entrance_criteria = [
  { id = "EN-1", text = "SL-002 design run dr-01a17aaf is locked (revision 37), including the RV-005 repairs." },
]
exit_criteria = [
  { id = "EX-1", text = "config.Window gains retain_messages: Option(Int); the field is optional and nullable (absent means None)." },
  { id = "EX-2", text = "validate refuses, in this order: non_positive:retain_messages, retain_without_max_messages (set while max_messages is None), retain_below_max_messages (less than max_messages)." },
  { id = "EX-3", text = "window_json encodes retain_messages as a fourth key, so a change to it changes window_json." },
  { id = "EX-4", text = "nix/module.nix declares window.retainMessages (types.nullOr types.ints.positive, default null) and passes it as window.retain_messages; nix flake check passes." },
  { id = "EX-5", text = "gleam format --check and just check are clean; the phase diff has been reviewed before PHASE-02 starts." },
]
verification = [
  { id = "VT-1", expects = "decode, the three refusals, and window_json carrying retain_messages", test_file = "test/screwtape/config_test.gleam", keywords = ["retain_messages", "retain_without_max_messages", "retain_below_max_messages", "non_positive:retain_messages"], waived = false },
  { id = "VT-2", expects = "the Home Manager option exists and is passed through", test_file = "nix/module.nix", keywords = ["retainMessages", "retain_messages"], waived = false },
  { id = "VA-1", text = "Phase review: the diff is reviewed (code-review) and findings disposed before PHASE-02." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Pure merge"
objective = "Add the pure core both paths share: normalise.Light, normalise.refresh and one keyword-flag helper; screwtape/retain with Rule and merge (DEC-025, design § 5.2 The merge); and the retain purity rule in check_imports (I5)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 is complete and reviewed." },
]
exit_criteria = [
  { id = "EX-1", text = "normalise.message and normalise.refresh derive is_seen and is_flagged through one helper; no second keyword-to-flag mapping exists (POL-001)." },
  { id = "EX-2", text = "normalise.refresh(message, light, state) replaces mailbox_ids and keywords, re-derives the flags and sets email_state to state; every other field is unchanged." },
  { id = "EX-3", text = "retain.merge applies, in order: drop gone, apply refreshes by id, add fetched (fetched wins on a clash), mailbox filter, age bound (after_ms), newest first by normalise.compare_received, take keep." },
  { id = "EX-4", text = "test/check_imports.gleam lists src/screwtape/retain.gleam as pure, allowing only screwtape/model, screwtape/normalise and gleam_stdlib; just check-imports passes." },
  { id = "EX-5", text = "gleam format --check and just check are clean; the phase diff has been reviewed before PHASE-03 starts." },
]
verification = [
  { id = "VT-1", expects = "merge units: gone dropped; a refresh moving a message out of the window drops it; fetched wins; trim to keep; age bound only without retain_messages; order matches compare_received", test_file = "test/screwtape/retain_test.gleam", keywords = ["retain.merge", "Rule(", "compare_received"], waived = false },
  { id = "VT-2", expects = "refresh replaces only the mutable fields and re-derives the flags", test_file = "test/screwtape/normalise_test.gleam", keywords = ["normalise.refresh", "Light("], waived = false },
  { id = "VT-3", expects = "retain is held to the purity rule", test_file = "test/check_imports.gleam", keywords = ["src/screwtape/retain.gleam"], waived = false },
  { id = "VA-1", text = "Phase review: the diff is reviewed (code-review) and findings disposed before PHASE-03." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "JMAP changes and light get"
objective = "Add the wire surface: request.Method.EmailChanges, request.email_changes and request.email_get_light; decode.ChangesPage/email_changes and decode.LightPage/light_emails; the jmap_fixture builders the sync tests will need; and the opening_entries length guard (CHR-004 item)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 is complete and reviewed (decode.light_emails returns normalise.Light)." },
]
exit_criteria = [
  { id = "EX-1", text = "request.email_changes sends sinceState and maxChanges; request.email_get_light asks for properties [id, mailboxIds, keywords] and no body values; method names stay inside request (I6)." },
  { id = "EX-2", text = "decode.email_changes returns ChangesPage(new_state, has_more, created, updated, destroyed); a cannotCalculateChanges entry decodes as JmapMethod(\"Email/changes\", \"cannotCalculateChanges\")." },
  { id = "EX-3", text = "decode.light_emails returns LightPage(lights, state, not_found), with the same shape checks as the full Email/get decoder." },
  { id = "EX-4", text = "jmap_fixture gains changes_response, a cannotCalculateChanges entry built on error_entry, and a light Email/get response; opening_entries fails loudly when request.opening's call count differs from its argument sets." },
  { id = "EX-5", text = "gleam format --check and just check are clean; the phase diff has been reviewed before PHASE-04 starts." },
]
verification = [
  { id = "VT-1", expects = "changes and light decoders: shapes, method error, malformed input", test_file = "test/screwtape/jmap/decode_test.gleam", keywords = ["email_changes", "light_emails", "cannotCalculateChanges"], waived = false },
  { id = "VT-2", expects = "the two new invocations carry their arguments", test_file = "test/screwtape/jmap/request_test.gleam", keywords = ["email_changes", "email_get_light", "maxChanges"], waived = false },
  { id = "VT-3", expects = "fixture builders exist and the opening guard is in place", test_file = "test/support/jmap_fixture.gleam", keywords = ["changes_response", "cannotCalculateChanges"], waived = false },
  { id = "VA-1", text = "Phase review: the diff is reviewed (code-review) and findings disposed before PHASE-04." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "The Prior"
objective = "Add model.Prior and store/query.prior with its small query_state reader, so a committed store can be read back as a value (design § 5.2 The Prior; I-M5)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 is complete and reviewed." },
]
exit_criteria = [
  { id = "EX-1", text = "model.Prior carries account_id, api_url, email_state, window_json, mailboxes, query and messages." },
  { id = "EX-2", text = "query.prior reuses query.account_id, query.mailboxes and query.message; it returns Store(\"no_snapshot\") for a store with no snapshot." },
  { id = "EX-3", text = "I-M5: the existing read_queries_round_trip_every_fixture_message_test is extended to read through query.prior; every message equals its canonical form, and the query record, mailboxes, Email state, window_json and api_url equal what was written. No new dump-based test." },
  { id = "EX-4", text = "gleam format --check and just check are clean; the phase diff has been reviewed before PHASE-05 starts." },
]
verification = [
  { id = "VT-1", expects = "query.prior round-trips the fixture store (I-M5) and refuses a store with no snapshot", test_file = "test/screwtape/store_test.gleam", keywords = ["query.prior", "read_queries_round_trip_every_fixture_message_test", "no_snapshot"], waived = false },
  { id = "VA-1", text = "Phase review: the diff is reviewed (code-review) and findings disposed before PHASE-05." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-05"
name      = "Full path through the merge"
objective = "Route the existing full sync through retain.merge with an optional Prior: sync.run takes prior, chooses full with no_state or window_changed, light-refreshes every stored id, fetches bodies only for query ids not stored, and reports mode and fallback_reason. get_emails and the light get share one get_chunked loop (POL-001)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 is complete and reviewed." },
]
exit_criteria = [
  { id = "EX-1", text = "sync.run(client, writer, bounds, prior, now); Bounds carries window, max_pages and max_body_bytes; Summary gains mode: Mode and fallback_reason: Option(String). cli passes None until PHASE-07 wires the Prior." },
  { id = "EX-2", text = "The Prior is unusable (no_state) when api_url, account_id or the stored bodies' max_body_value_bytes differ; window_changed when window_json or the resolved mailbox ids differ. Both run full, the latter keeping and light-refreshing every stored id." },
  { id = "EX-3", text = "get_chunked is the one chunked get loop over in_chunks, only_requested and all_answered; get_emails and the light get both use it." },
  { id = "EX-4", text = "With no Prior, the run's ids, store and requests equal M1's apart from the summary fields: the existing sync tests pass with only the run signature changed." },
  { id = "EX-5", text = "sync_fixture gains string_argument, a public type_state and run_twice; expect_unchanged accepts any seeded store, not a sibling helper." },
  { id = "EX-6", text = "gleam format --check and just check are clean; the phase diff has been reviewed before PHASE-06 starts." },
]
verification = [
  { id = "VT-1", expects = "another server, another account and a body-limit change -> no_state with everything refetched; a window_json change and a mailbox rename -> window_changed with the stored tail kept", test_file = "test/screwtape/sync_test.gleam", keywords = ["no_state", "window_changed", "api_url"], waived = false },
  { id = "VT-2", expects = "the fixture extensions exist", test_file = "test/support/sync_fixture.gleam", keywords = ["string_argument", "run_twice", "pub fn type_state"], waived = false },
  { id = "VA-1", text = "Phase review: the diff is reviewed (code-review) and findings disposed before PHASE-06." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-06"
name      = "Incremental path"
objective = "Add the incremental path (DEC-026): Email/changes paging from the Prior's Email state with maxChanges = maxObjectsInGet, the cannot_calculate_changes and too_many_changes fallbacks, the skip of Email/query when nothing changed, and the stored Email state rule (I-M3). Pin I-M1..I-M4 with the § 9 tests."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 is complete and reviewed." },
]
exit_criteria = [
  { id = "EX-1", text = "Pages fold as changed = (created ∪ updated) − destroyed, destroyed accumulating; the last newState is kept; pages count against max_pages." },
  { id = "EX-2", text = "cannotCalculateChanges (matched via request.method_name(EmailChanges)) and hasMoreChanges at the page cap fall back to full with the Prior, reported as cannot_calculate_changes and too_many_changes; every other error fails the run before the write." },
  { id = "EX-3", text = "Nothing changed: no Email/query and no Email/get with ids; the Prior's query record is carried; only the age bound removes messages. Something changed: Email/query runs and only changed stored ids are light-refreshed; changed ids neither stored nor queried are ignored." },
  { id = "EX-4", text = "Stored Email state: the last Email/changes newState on the incremental path, the opening state on the full path." },
  { id = "EX-5", text = "Every § 9 invariant test passes: deletion_backfills_test, incremental_equals_full_test, age_out_without_changes_test, unchanged_account_fetches_no_email_test, outside_window_change_ignored_test, concurrent_move_converges_test, stored_email_state_test, failure_then_retry_test; plus paging, destroyed-wins and both fallbacks." },
  { id = "EX-6", text = "TDD scaffolding that duplicates these tests is pruned; gleam format --check and just check are clean; the phase diff has been reviewed before PHASE-07 starts." },
]
verification = [
  { id = "VT-1", expects = "the § 9 invariant tests for I-M1..I-M4", test_file = "test/screwtape/sync_test.gleam", keywords = ["deletion_backfills_test", "incremental_equals_full_test", "age_out_without_changes_test", "unchanged_account_fetches_no_email_test", "outside_window_change_ignored_test", "concurrent_move_converges_test", "stored_email_state_test", "failure_then_retry_test"], waived = false },
  { id = "VT-2", expects = "paging and fallbacks", test_file = "test/screwtape/sync_test.gleam", keywords = ["cannot_calculate_changes", "too_many_changes", "hasMoreChanges"], waived = false },
  { id = "VA-1", text = "Phase review: the diff is reviewed (code-review) and findings disposed before PHASE-07." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-07"
name      = "CLI, docs and live acceptance"
objective = "Wire the Prior into the CLI (short-lived reader, closed before the writer opens), render mode and fallback_reason in the summary, document the sync paths in the README, and accept M2 live against the real account."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 is complete and reviewed." },
]
exit_criteria = [
  { id = "EX-1", text = "cli.sync loads the Prior through query.prior on a reader it closes before opening the writer; no_snapshot means no Prior; any other read error fails the run." },
  { id = "EX-2", text = "The summary document carries \"mode\": \"incremental\" | \"full\" and \"fallback_reason\": null | \"<reason>\"." },
  { id = "EX-3", text = "README's sync section covers the two paths, the one-off full run after upgrading (window_changed), retention covering configured mailboxes only, retain_messages requiring max_messages, and the bounded overspend on cannotCalculateChanges." },
  { id = "EX-4", text = "gleam format --check, just check and nix flake check are clean." },
]
verification = [
  { id = "VT-1", expects = "the summary carries mode and fallback_reason; a missing store means no Prior", test_file = "test/screwtape/cli_test.gleam", keywords = ["fallback_reason", "\"mode\"", "no_snapshot"], waived = false },
  { id = "VT-2", expects = "the README documents M2", test_file = "README.md", keywords = ["incremental", "retain_messages", "cannotCalculateChanges"], waived = false },
  { id = "VH-1", text = "Live check by the operator: two consecutive syncs against the real account; the second reports mode incremental and sends no Email/get with ids. Result recorded in notes." },
  { id = "VA-1", text = "Phase review: the diff is reviewed (code-review) and findings disposed before audit." },
]
specs        = []
requirements = []
