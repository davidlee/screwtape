[[phase]]
id        = "PHASE-09"
name      = "Deployment and live acceptance"
objective = "Enable Screwtape on the host through ~/flakes, validate the user unit under hardening (ASM-005), and run RFC-020 M1's live acceptance with a read-only token."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-07 exit criteria hold." },
  { id = "EN-2", text = "The operator has created a Fastmail 'Read-only access' token with mail scope (research host check 9) and stored it in 1Password; its op:// ref is known." },
  { id = "EN-3", text = "~/flakes can evaluate this flake as an input: either CHR-001's quotient pin is swapped to a published tag, or the operator accepts the host-local git+file pin for this host." },
  { id = "EN-4", text = "The operator has chosen whether to enable lingering (design § 6)." },
]
exit_criteria = [
  { id = "EX-1", text = "~/flakes: the screwtape input (nixpkgs.follows, home-manager.follows); features/satan/screwtape.nix whose homeManager key imports the module and sets the ref and window; lingering per EN-4; SATAN.md host facts and smoke checks." },
  { id = "EX-2", text = "ASM-005: provisioned, service started, journal read. The unit succeeds under the EX-1 hardening of PHASE-07, or only a failing key is relaxed and recorded; whether the user credential is TPM-bound is recorded; ASM-005 is settled." },
  { id = "EX-3", text = "I7 smoke: stat shows the store directory owned by the operator at 0700 (the load-bearing check) and the store at 0600; the -wal and -shm files are stat'ed while a connection holds the store open (WAL removes them when the last connection closes), and show the same owner and mode." },
  { id = "EX-4", text = "Live acceptance (RFC-020 M1): one sync puts a bounded set of real messages in the store; Mailbox and Email states from a separate read-only session, taken before and after, are equal; the session's capabilities, isReadOnly and canCalculateChanges are recorded (F2, F4, F6); ASM-004 is settled from the session's accounts." },
  { id = "EX-5", text = "OQ-A is decided by the operator from the observed isReadOnly value and recorded (a decision record, or a backlog item for fail-closed)." },
]
verification = [
  { id = "VH-1", text = "The operator confirms the live sync, the unchanged mailbox states and the smoke checks." },
  { id = "VH-2", text = "The operator rules on OQ-A." },
  { id = "VA-1", text = "ASM-004 and ASM-005 are settled through `doctrine knowledge` with the observed evidence." },
]
