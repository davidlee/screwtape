id = 28
slug = "screwtape-consumer-cursor-is-an-arrival-cursor-over-received-at-ms-id"
title = "Screwtape consumer cursor is an arrival cursor over (received_at_ms, id)"
record_kind = "decision"
status = "accepted"
created = "2026-10-27"
updated = "2026-10-27"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "satan:RFC-020 D1 gives each consumer its own cursor over the store. The store has no monotonic change marker: DEC-008 rewrites every row each sync, message.email_state is restamped by every light refresh, and JMAP states are not orderable."
choice = "An arrival cursor: list returns messages strictly after a consumer-held cursor in (received_at_ms, id) order. Screwtape keeps no per-consumer state and no schema change."
alternatives = ["a change cursor: schema v2 with a per-run sequence and per-message changed_seq, bumped when a message is new or its mailboxIds/keywords change"]
rationale = "Triage and classification act on new mail; a message's current flags are already in the read output. The change cursor costs a migration and a merge comparison for cases (flag changes, moves back into the window) triage does not need yet."
consequences = ["Misses mail that enters the window with an older received_at (late delivery, moved back to Inbox, widened window); a consumer may re-scan a short overlap and drop seen ids", "A change cursor can be added later as schema v2 without breaking this one"]
decided_by = "operator (david), 2026-10-27: 'ok, arrival it is'"
decided_on = "2026-10-27"

