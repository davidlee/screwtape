updated = "2026-10-25"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-001 delivers the token as $CREDENTIALS_DIRECTORY/<id>; it must never reach argv, logs, errors or the store."
choice = "Read $CREDENTIALS_DIRECTORY/<credential_name>; it must be non-empty. Wrap it in an opaque Token holding fn() -> String so string.inspect shows //fn. Only the authorization-header builder calls it. Error types never carry request headers or response bodies. Tests run a sentinel token through every error path and assert it is absent from stdout, stderr, inspected errors and a full SQLite dump. argv carries only the credential name."
alternatives = ["token via environment variable"]
rationale = "Redaction by construction, proven by tests."
consequences = ["SL-001 scope's 'only through its environment' is superseded"]
decided_by = "agent proposal; operator assent (david)"
decided_on = "2026-10-26"

