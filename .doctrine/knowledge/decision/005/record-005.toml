context = "esqlite is a C NIF built via rebar3 pc; nix-gleam documents the pc override but an offline nix flake check build is unproven (research finding 3). A spike is code, so it cannot run before an approved plan."
choice = "Plan phase 1 is a walking skeleton: a Gleam project using sqlight, gleam_httpc and an FFI halt, built by nix-gleam (rebar3 with pc) as an erlang-shipment, with gleam test running offline under nix flake check. It also checks stdout flushing on halt and CA certificates (TLS handshake outside the sandbox). Fallback 1: ESQLITE_USE_SYSTEM against nixpkgs sqlite; fallback 2: stop and consult."
alternatives = ["spike during design", "escript export"]
rationale = "Settles the riskiest unknown before any domain code depends on it; an escript cannot load a NIF .so from its archive."
