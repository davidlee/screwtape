tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Store paths must come from configuration (NF-006), the read wrapper and the unit must agree on them, and limits are runtime facts (research finding 5)."
choice = "JSON config generated by the Home Manager module, path baked into the wrapper and the unit. Fields: session_url, credential_name, store_path, window (mailboxes by role or name; max_age_days and/or max_messages), max_body_bytes (cumulative stored body text per message, enforced in normalise, also sent as maxBodyValueBytes; RV-001 F-9), max_pages, max_total_bytes (response body bytes per run, enforced by the transport's per-request max_body_size; RV-001 F-12, F-19), request_timeout_ms. max_pages, max_total_bytes and query instability are errors leaving the store unchanged; body truncation is recorded per part with truncated_by. Concurrency 1; no retry, including httpc's autoretry (RV-001 F-20)."
alternatives = ["TOML config", "environment variables", "truncation metadata instead of error at ceilings"]
rationale = "No TOML dependency; ceilings signal misconfiguration rather than silently partial windows."
consequences = ["The next timer tick is the retry"]
decided_by = "agent proposal; operator assent (david)"
decided_on = "2026-10-26"

