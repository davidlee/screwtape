[facet]                         # every field typed; seeded empty (captured later)
context = "Tests cover auth/API errors, malformed responses, limits and missing messages; diagnostics must not leak token or mail content."
choice = "Error variants: Config, Credential, Http (timeout, connect, TLS, status), Auth (401/403), RateLimited, JmapRequest, JmapMethod, Decode (path), LimitExceeded (max_pages | max_total_bytes), QueryUnstable, Store (incl. no_snapshot, schema_mismatch). Each renders as one stderr JSON line with type strings only. main's guard maps any crash to a generic internal error with the OTP logger silenced (RV-001 F-1). notFound ids are skipped and counted."
alternatives = ["free-text error messages including response bodies"]
rationale = "Diagnosable without leaking content; maps cleanly to exit codes (DEC for inq-11)."
