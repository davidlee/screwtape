[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-016 runs Screwtape as the operator, so the store is owned by the operator's uid."
choice = "Read verbs open the store read-only as the caller. The Home Manager module installs a screwtape wrapper that only adds --config <generated path>. No sudo, no sudoers rule, no re-exec."
alternatives = ["sudo -u screwtape re-exec with an authenticating sudoers rule (DEC-003)"]
rationale = "With no uid boundary there is nothing for a re-exec to cross; it would be friction without protection."
consequences = ["Supersedes DEC-003", "The NOPASSWD question disappears", "M3 consumers running as the operator read the store directly; OQ-11's two contract forms both remain possible"]
