created = "2026-10-27"
updated = "2026-10-27"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Both sync paths must produce the retained set the same way (POL-001); the store equals neither the fetch window nor the server. Supersedes DEC-022, whose invariant failed after a deletion (no backfill) and when retain_messages kept messages past max_age_days (GPT review, 2026-10-27)."
choice = "Pure module screwtape/retain: drop gone ids (destroyed or notFound); apply light refreshes (mailboxIds, keywords and derived is_seen/is_flagged) to stored messages; add fully fetched new messages; keep messages in at least one configured window mailbox; sort receivedAt desc, id desc (the list order); take the newest retention count (and the age bound when retention defaults to the window). Invariant: after a run during which the server's Emails did not change, the store's newest max_messages (all, when unset) messages that pass the window filter (mailboxes and max_age_days) equal a full sync's window; under concurrent change it holds after the next run, because the stored Email state predates the change. It holds because every run with Email changes takes window membership from Email/query (DEC-026). receivedAt ties at the boundary may order differently from the server (accepted, documented)."
alternatives = ["SQL upsert/delete/trim in the store", "a separate merge per path", "local window selection with a count-capped backfill fallback"]
rationale = "Pure, SQLite-free tests; shared by both paths; reuses write_snapshot unchanged; the invariant is stated over what a full sync can actually return."
consequences = ["Every run rewrites the retained set (bounded, local, ~12 KB/message)", "Retention keeps; it never backfills: a message below the top max_messages is stored only if a query once reached it"]
decided_by = "agent proposal (after GPT review); operator assent (david)"
decided_on = "2026-10-27"

