choice = 'Verbs: sync (service-only, run by the screwtape user unit; RV-001 F-18); mailboxes; list [--mailbox] [--since] [--from] [--unread] [--limit <=500, default 50] [--offset]; read <id> [--max-bytes]; thread <id>. Hand-matched argv. stdout one JSON document in a {"version":1,...} envelope; stderr JSON-line diagnostics. Exit 0/1/2. The module-installed wrapper only adds --config (DEC-017).'
alternatives = ["clip or glint parsing"]
rationale = "Minimal dependencies; the version envelope keeps the CLI usable as a contract."
