context = "HTML-only bodies are reduced to text at sync time, never fetching external resources (SL-001 scope)."
choice = "A SAX fold over htmgrrrl events: drop script, style, head; block elements and br become newlines; li becomes '- '; img becomes its alt text; links become 'text <href>' as inert text; whitespace collapsed. The module has no HTTP import. Parse failure stores the body with conversion_failed."
alternatives = ["regex stripping", "an external converter binary"]
rationale = "Structural guarantee of no fetch; small hand-written fold over a pure Erlang parser."
