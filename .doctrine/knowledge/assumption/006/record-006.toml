[facet]                         # every field typed; seeded empty (captured later)
claim = "The SL-005 window (16,384 body bytes, 512 subject, 6 lists x 10 x (128 + 254), 20 attachments x 2 x 128; about 45 KB raw) fits Jev's 32,000-token limit for the state plus one question for ordinary text. Adversarial text near one token per byte may not; that message is then skipped as jev_context (DEC-039) and the consumer withholds it. Accepted residual: a sender can make their own message unclassifiable; no retry with a smaller budget."
confidence = "medium"
basis = "observation"
validation_plan = "VT encodes a worst-case window through pii.strip and pins its byte size (placeholders such as ?[…] can lengthen state past the seen bounds, up to about 1.6 times); VH live probe with a synthetic (POL-002-safe) worst-case mail before the bounds are final. SL-004 PHASE-14: 19.7 KB took 5,884 input tokens."
