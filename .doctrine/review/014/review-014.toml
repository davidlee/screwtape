[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "list's --max-bytes refusal is post-hoc, so list now reports the selection's value errors for a flag it does not take"
detail = """
Expected: `list` does not take `--max-bytes` (EX-1 adds it to read's selection only; test comment cli_test.gleam:1287 "--max-bytes stays an unknown flag there"). An unknown flag should be `unknown_argument` wherever and however it appears, as it was before d616d8f (parse_list_flags' `_ -> usage("unknown_argument")` fired on the token itself).

Observed: `--max-bytes` was added to the shared `parse_list_flags` (argv.gleam:302-309) and `parse_list` rejects a *set* `max_bytes` only after every flag has parsed (argv.gleam:229-232, D1). So list's diagnosis of the unknown flag now depends on the selection's value grammar and on later flags:
- `list --max-bytes -1`  -> invalid_max_bytes   (was unknown_argument)
- `list --max-bytes`     -> missing_value       (was unknown_argument)
- `list --max-bytes 5 --max-bytes 5` -> repeated_argument (was unknown_argument)
- `list --max-bytes 5 --limit 0` -> invalid_integer (was unknown_argument)
(Derived by reading flag_value/max_bytes_value argv.gleam:169-174, 343-356 and the left-to-right recursion; not executed.) Only the well-formed-value case is pinned (cli_test.gleam:1288), which is the one case D1's ordering leaves unchanged, so the drift is untested. None of these invocations worked before, so C6 is not breached in letter, but `list` now names a value constraint of a flag it rejects - a misleading diagnostic - and ListFlags carries a field that one of its two grammars must remember to refuse (coupling list's grammar to the selection's; a future third consumer of ListFlags inherits the same trap).

D1's rationale ("a malformed value names its own error") is right for the selection and backwards for list. Suggestion: let parse_list_flags know whether `--max-bytes` is admitted (e.g. a Bool/grammar parameter, or the selection consuming `--max-bytes` via a wrapper before delegating), so list hits `unknown_argument` on the token; add one of the malformed cases above to the usage table.
"""
disposition = "fix-now"
response = "Confirmed by reading argv.gleam. Fixed: ListFlags gains takes_max_bytes (which grammar is reading); the --max-bytes arm is guarded 'if flags.takes_max_bytes', so list hits unknown_argument on the token itself; parse_list's post-hoc check removed. D1 superseded. Pinned: list --max-bytes -1 and list --max-bytes (no value) -> unknown_argument in read_after_usage_reasons_test (both would fail under the post-hoc version)."

