[[finding]]
id = "F-1"
status = "verified"
severity = "nit"
title = "Value-error vs offset_with_after precedence is implicit, not pinned (bad --since wins, untested)"
detail = """src/screwtape/argv.gleam:95-96 (parse_list) runs filters_of (which validates --since's calendar date, post-loop) before page_of (offset_with_after). So 'list --after "" --offset 0 --since 2026-13-01' is Usage(invalid_since), consistent with 'a bad cursor still names itself' (cli_test.gleam list_after_usage_reasons_test case [--after x --offset 1] -> invalid_cursor). But no case pins the --since ordering: swapping the two 'use' lines in parse_list passes every test. PHASE-05 extends this chain (missing_after -> offset_with_after -> missing_max_bytes, design 5.2 'after the flags parse') and will reuse filters_of, so the rule 'every value error beats a combination error' should be pinned now. Suggest: add #(["list", "--after", "", "--offset", "0", "--since", "2026-13-01"], "invalid_since") to list_after_usage_reasons_test."""
disposition = "fix-now"
response = 'Confirmed by mutation: swapping filters_of/page_of in argv.parse_list passed every test. Added #([list, --after, "", --offset, 0, --since, 2026-13-01], invalid_since) to cli_test list_after_usage_reasons_test; the same swap now fails that test (orchestrator re-ran). Doc comment updated: a bad cursor or --since still names itself.'

