Observed: `doctrine slice verify-vt 1` → `✗ FAIL VT-2 — keyword ca_file absent`. It was never present. The behaviour is covered: the suite passes `Some(server.ca_path)` positionally as the `ca_file` argument of `cli_fixture.config_text_with` (token_leak_test.gleam:442) and `cli.production_send` (:564), so every subprocess run trusts the per-run CA. Only the traceability keyword is missing. Plan criteria are immutable, so the test has to name it."""
