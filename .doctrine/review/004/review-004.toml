title = "§ 9 html_text promises script/style are dropped; uppercase `<SCRIPT>` is mis-tokenised by htmerl and may leak"
detail = """
Expected: § 9 "html_text: script, style and head are dropped" holds for all inputs, or the design states the exception.
Observed (PHASE-03 Risks): htmerl 0.2.1 mis-tokenises uppercase raw-text elements (`<SCRIPT>`). Script source may appear in the stored text, and the text after it may be dropped. This was accepted for M1. CHR-002 carries the upstream report, and the test pins only "no crash". The consequence is cosmetic and not a security issue: the text is stored and printed inert, and nothing executes it (I5). The design states the rule without the exception, though."""
disposition = "design-wrong"
response = "The code limitation is accepted for M1, and its upstream fix is already owned (CHR-002), so no new backlog item is needed. The design must state the exception. Reconciliation Brief § Per-slice, F-17: § 5.5 edge plus the § 9 html_text case."

