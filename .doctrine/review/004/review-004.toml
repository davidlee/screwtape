title = "§ 5.1/§ 5.2 omit PHASE-10 and DEC-021 contract refinements: opaque Client/Budget, control-byte credential rejection, normalise's input records"
detail = """
Expected: § 5.2 key signatures and § 5.1 responsibilities match the code (phase sheets swept at audit).
Observed:
- `Client` and `Budget` are `pub opaque type` (client.gleam:46, :51), with accessors `session_of` and `budget_of` (PHASE-10 T3). § 5.2 shows `Client` as a public record. Opaque is narrower, because the token is unreachable from callers. `Budget` stays a pure Int (the T3a counters-cell proposal was rejected).
- `credential.read` rejects a token with control bytes (< 0x20 or 0x7f, after trimming) as `Credential("invalid")` (operator choice (b), PHASE-10 T1b, d64002a). Neither § 5.2 nor the § 9 credential cases mention it.
- DEC-021: `normalise` owns stdlib-only input records for the JMAP Email shape and a pure `utc_date_ms`. `jmap/decode` builds them, so a bad timestamp is `Decode(path)` (hence the decode → normalise edge in F-5). The § 5.1 table doesn't say so."""
disposition = "design-wrong"
response = "All three are recorded choices (PHASE-10 T3, operator (b), DEC-021) and stricter than the design. Reconciliation Brief § Per-slice, F-16: § 5.2 signatures and credential rule; § 5.1 normalise row."

