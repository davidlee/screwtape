[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The body-only cap leaves attacker-controlled metadata able to block the classification stream"
detail = """
Expected: the design's stated mitigation prevents a single mail from exceeding Jev's context and blocking the stream (DEC-037; .doctrine/slice/004/design.md:471-473).

Observed: classify/state caps only body text (:215-237). Subject bytes, sender-domain count/length, attachment count, attachment type and attachment-name bytes remain unbounded. The only other input bound is 16 MiB over the entire invocation (:354-358), far above the cited 32k-token per-state/question limit (:91-94). Current JMAP decoding accepts arbitrary strings and unbounded lists (src/screwtape/jmap/decode.gleam:433-487, :543-550, :553-584), and render.print_bodies caps only bodies (src/screwtape/render.gleam:261-281). IMP-002 explicitly documents the producer's unbounded metadata; it is open, not an implemented safeguard.

Counterexample: a small-body read envelope with tens of thousands of attachments/long filenames can fit below 16 MiB while sending far more state than the 16 KiB rationale budgets. On an upstream context rejection, DEC-037 stops at that mail, and read --after the last successful cursor feeds the same oversized mail again.

Inference: exact token counts depend on Jev's tokenizer, but the absence of any metadata/request bound is verified. The claimed anti-blocking guarantee does not follow from a body-only cap.

Repair: define an independent total classifier-state/request budget covering every retained field and container, with deterministic reductions and honest partial-evidence indicators, or an explicit oversized-message recovery procedure. This need not implement or change the deferred producer-contract work in IMP-002. Test large subjects, many senders and many attachment names, including recovery."""
disposition = "fix-now"
route = "review"
response = """
Contest accepted; the 25 KB claim was false. Bound completed in 5.2: at most 10 bodies (bodies_omitted), sender domains at most 253 bytes (longer ones dropped and counted), control characters other than tab, LF and CR removed before stripping. Worst case recomputed as about 51 KB encoded (quote and backslash escape to two bytes). The hard guarantee is withdrawn: whether a worst case fits the 32k token limit is stated as unmeasured, and the cursor skip procedure (5.5) covers a message that does not. Design, DEC-034 and slice scope objective 3 now consistently say unlikely, matching DEC-037.
"""

