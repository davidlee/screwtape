[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Redaction can expand text after the body cap, violating the 16 KiB state bound"
detail = """
Expected: DEC-034 and classify/state.build keep transmitted body texts within 16,384 bytes total.

Observed: .doctrine/slice/004/design.md:230-237 caps the original text before stripping and asserts that stripping never lengthens it. The URL rule at :174-176 contradicts this: https://example.com/a is 21 UTF-8 bytes, whereas https://example.com/[…] is 25. A synthetic 16,384-byte body made from 744 repetitions of the original URL plus a space and final padding becomes 19,360 bytes under the specified rule. These byte counts were reproduced in memory. Section 9 (:534-538) proposes a universal never-lengthens test that the required transformation cannot satisfy.

The order also cuts recognisable PII before matching: ('x ' repeated 8189 times) followed by alice@example.com is truncated to an alice@ suffix at byte 16,384, defeating a complete-email rule.

Inference: a conforming implementation either violates the body bound or changes the accepted redaction output to satisfy an impossible test. This is a verified specification contradiction; no classifier implementation exists yet.

Repair: apply redaction before enforcing the final output-byte budget, or otherwise account explicitly for expansion, with consistent truncation flags and codepoint boundaries. Define treatment of already-truncated input fragments. Replace the false monotonic-length property with tests of the actual final aggregate byte bound and short-URL/cutoff cases."""
disposition = "fix-now"
route = "review"
response = """
Contest accepted; verified in src/screwtape/render.gleam: read reports its max-bytes cut only in data.output_truncated, and body_json passes the stored per-body flag unchanged. Repaired in 5.2: Mail carries output_truncated. A body is cut on arrival when its is_truncated is true, or output_truncated is true and it is the last body with text or any body after it (print_bodies cuts in body order, so that is the body it cut). Such a body loses its last partial word before stripping and is sent with is_truncated true. Section 9 tests this from real render.read output with max_bytes ending mid-address. DEC-034 amended.
"""

