[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "The model allowlist admits a valid credential and can echo it to stdout"
detail = """
Expected: SL-004 §5.5 I1 and DEC-012 require that the Jev key never appears on stdout, including when server-controlled reply text is hostile.

Observed: .doctrine/slice/004/design.md:261-272 accepts any model matching ^[a-z0-9][a-z0-9._/-]{0,63}$ and :363-364 prints that string. The current credential reader accepts every nonempty trimmed string without control bytes (src/screwtape/credential.gleam:43-57). There is no comparison with the configured/pinned model.

Synthetic counterexample, checked in memory: sentinel-jev-key-9f3c1d7a4b2e5068 is both an accepted credential and an accepted model. An otherwise valid reply containing this credential as model therefore passes the specified validator and is printed. This defeats the very response-reflection case the existing sentinel suite tests for JMAP (test/screwtape/token_leak_test.gleam:26-31); its existing uppercase sentinel at :77 would be rejected by the model regex and can mask this hole.

Inference: a broken or hostile Jev/gateway response can expose the key through the permitted string field. This is a constructive design counterexample, not a reproduced live leak; no key was read or service called.

Repair: validate the reported model against an explicit expected pinned model identity (with a defined provider-prefix mapping if needed), rather than only its character shape. Preserve DEC-036's reported-model field after validation. Test a lowercase, shape-valid sentinel reflected in model, alongside mismatched model identities."""
disposition = "fix-now"
route = "review"
response = """
Verified: credential.gleam token accepts any nonempty trimmed string without control bytes, and the I1 sentinel in token_leak_test is uppercase, so it cannot exercise this. Repaired in design 5.2 (jev): reply takes the configured model and requires the reported model to equal it, or equal it after its last slash (gateway provider prefix); anything else is Decode model. Principle 2 and I2 now say equality, not shape. Section 9: token_leak server reflects a lowercase, model-shaped sentinel in model; jev hostile replies include a model other than the configured one. DEC-036 unchanged: model is still the id Jev reports, now also checked against config.
"""

