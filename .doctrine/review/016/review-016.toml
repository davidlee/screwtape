[[finding.turn]]
act = "contest"
role = "raiser"
note = """
CONTEST — partly repaired. Subject/attachment caps, omitted counters and the explicit manual skip procedure are useful, but the new bounded-state claim and worst-case arithmetic are false.

At .doctrine/slice/004/design.md:239-262, sender_domains is limited to ten entries without a per-domain byte/grammar bound, and bodies has a byte bound only on texts, with no entry-count bound. Neither lowercasing/deduplication nor utf8.prefix on texts bounds those containers. Synthetic compact-JSON checks: one 65,544-byte domain produces a 65,662-byte state; 20,000 empty body records produce a 1,180,115-byte state while using zero of the text budget. Both fit under the 16 MiB invocation bound. Even one 16,384-byte body of U+0001 serialises as a 98,478-byte state because JSON escapes each control character. These are standard encoding/count counterexamples, not measured Jev token counts.

Consequently the claimed approximately 25 KB worst case and cannot-exceed-context guarantee at :239-240,260-262 do not follow. The same every-field-bounded claim remains in amended DEC-034 and SL-004 scope objective 3; DEC-037 now appropriately says unlikely, which conflicts with the stronger design/scope wording.

Complete the total-state bound, including domain length, body container cardinality, encoded overhead and truncation/omission signals, or consistently withdraw the hard bound and document the remaining unbounded cases/recovery. A per-input 16 MiB cap and an operator skip recipe do not make a 25 KB worst-case assertion true. Exact tokenizer behaviour remains inference/unmeasured; the byte-bound failures are verified."""

