[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Date protection exempts dotted phone numbers from the required number stripping"
detail = """
Expected: DEC-034's number rule strips phone/account-like runs of at least eight digits while preserving actual dates.

Observed: .doctrine/slice/004/design.md:177-182 first protects d.m.y with 1-4-digit parts, then strips long digit runs allowing dots. The synthetic ten-digit phone 0412.345.678 matches that protected shape in full; it is not an IPv4 dotted quad. It also matches the specified long-number rule, but that rule never sees it while masked, and unmasking restores it unchanged. The in-memory shape check confirmed both matches. No calendar ranges or boundaries preventing partial date matches inside longer numbers are specified.

Inference: the prescribed implementation sends ordinary dotted phone numbers unchanged, beyond the expressly accepted residual leaks of names, postal addresses and short numbers. This is a design-rule counterexample, not execution of an implemented pii module.

Repair: specify a bounded, calendar-plausible date grammar and whole-token boundaries, including precedence when a putative date is part of a longer identifier. Add negative protection cases for dotted phones and grouped account/card numbers, alongside genuine dates. Preserve the accepted date-protection decision; fix its overbroad realisation."""
disposition = "fix-now"
route = "review"
response = """
Contest accepted: a single space is a rule 5 separator, so 12.12.2026 3456 escaped. Repaired in 5.2 (pii): the whole-token boundary now forbids anything rule 5 would join, i.e. a digit, or a space, dot, slash or dash followed by a digit, at either end. A date followed by a single space and a time is one protected shape, so 12.12.2026 14:00 survives while 12.12.2026 3456 is stripped. Section 9 adds both cases. DEC-034 choice amended.
"""

