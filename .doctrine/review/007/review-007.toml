act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Module header (sync.gleam:12-16) now names the exception: a cannotCalculateChanges answer continues on the Client held before it, so its bytes are not charged (DEC-026).
"""

[[finding]]
id = "F-3"
status = "answered"
severity = "nit"
title = "Four meanings of 'changes' in scope/changes, and Counted/Uncounted misnames the outcome"
detail = """
Expected: names that each denote one concept (project standard: naming matters).

Observed (src/screwtape/sync.gleam ~lines 187-365): `Changes` is a `Start` constructor (`Changes(prior)`), a type (`type Changes { Counted(Delta) Uncounted(reason) }`), a function (`fn changes`), and in `scope` a local binding that shadows the function (`use #(client, changes) <- result.map(changes(...))`, then `case changes {`). Gleam accepts all of this, but in the `Changes(prior) ->` arm of `scope` the reader has to tell apart three of the four on adjacent lines.

`Counted`/`Uncounted` also implies a counting concept that does not exist. In the too_many_changes case the pages were received and folded; the server simply had more. What the variants actually say is whether the change set is known.

Suggestion (inference; the responder's call): `type ChangeSet { Known(Delta) Unknown(reason: String) }`, or similar, and a local name such as `answer`. No behaviour change.
"""
disposition = "fix-now"
response = """
Renamed `type Changes { Counted | Uncounted }` to `type ChangeSet { Known(Delta) | Unknown(reason) }`; the local binding in `scope` is `change_set`, so it no longer shadows `fn changes`. The `Start.Changes(prior)` constructor stays: it names the start (incremental from Email/changes), parallel to Fresh/Reuse. No behaviour change; 428 green.
"""

