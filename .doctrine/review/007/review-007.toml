[[finding]]
id = "F-2"
status = "answered"
severity = "nit"
title = "Module doc's budget invariant now has an undocumented exception"
detail = """
Expected: the sync module header states how the budget is threaded, and it should stay true or name its exception.

Observed: src/screwtape/sync.gleam:12-14 says "every request carries one call through `client.call_one` (A1) on the `Client` value the previous call handed back, so the byte budget is spent across the whole run." Since PHASE-09, the cannotCalculateChanges fallback continues on the Client from *before* the failed call (sync.gleam `changes`, ~line 343-345; DEC-026), so that response's bytes are not spent. The exception is documented only at `changes` (~line 314-318). A reader who trusts the module header will take the budget as exact; in fact it is bounded at about 2x (design § 5.2).

Suggestion: one clause in the header citing DEC-026, e.g. "... except a cannotCalculateChanges reply, which is not charged (DEC-026)."
"""
disposition = "fix-now"
response = """
Module header (sync.gleam:12-16) now names the exception: a cannotCalculateChanges answer continues on the Client held before it, so its bytes are not charged (DEC-026).
"""

