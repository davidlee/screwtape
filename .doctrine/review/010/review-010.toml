[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "read --after duplicates prior's ids->message loop and collides with private message_ids"
detail = "query.gleam:187-195 has private message_ids(tx) with ORDER BY received_at_ms, id (:765); prior already maps ids -> message -> Store(read_failed) (:130-135). Design adds a second message_ids and loop. Fix: generalise message_ids to take the selection; one messages_of(tx, ids) used by prior and read --after; note both in sec-2. Verified by orchestrator."
disposition = "fix-now"
response = "Fixed in design (sec-5-2, sec-8); confirmed by the reviewer's recheck."
route = "review"

