[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "cursor.parse accepts non-canonical text; int64 bound has two homes"
detail = "binary_to_integer accepts +05 and 007 (orchestrator verified: +05 -> 5), so parse is not the inverse of to_string. sec-3 puts the int64 check in argv, sec-5-2/C3 in cursor.parse; argv already has private max_offset (argv.gleam:60). Fix: accept only when to_string(c) == text; one home for int64 bounds in cursor, shared with argv."
disposition = "fix-now"
response = "Design amended at design revision 27 (sec-2/3/5-1/5-2/5-5/7/8/9/10); see design.md."

