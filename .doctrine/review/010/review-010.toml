[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "A future-dated message stalls an arrival cursor indefinitely"
detail = "received_at_ms is JMAP receivedAt, settable by Email/import (RFC 8621). One message dated 2099 moves a consumer's cursor past all normal arrivals until 2099; an overlap re-read does not recover. Fix: document in README gap and sec-8 with a consumer guard (do not store a cursor whose ms exceeds now + skew); clamping is an operator option."
disposition = "fix-now"
response = "Fixed in design (sec-5-2, sec-8); confirmed by the reviewer's recheck."
route = "review"

