[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Rule 3 wording: query is replaced only up to whitespace, quote, < or >"
detail = '''
Design § 5.4 rule 3 says everything from the first ? or # is replaced. The regex's tail [^\s<>"']* stops at whitespace, a quote, < or >, so https://h/p?q="secret" strips to https://h/p?[…]"secret". Pre-existing behaviour class, and the stop set keeps markup intact. Smallest fix: change the sentence (and the README What Jev sees wording) to "up to the next whitespace, quote, < or >"; no regex change. Source: pi run, executed through OTP re; not re-run by orchestrator.
'''
disposition = "fix-now"
response = 'Fixed in prose: design 5.4 rule 3 now says from the first ? or # up to the next whitespace, quote, < or > is replaced. No regex change. Operator agreed the recommended disposition ("agreed", 2026-10-29).'

