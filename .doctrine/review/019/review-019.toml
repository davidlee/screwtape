[[finding]]
id = "F-7"
status = "verified"
severity = "nit"
title = "Token rule linearity reason is misstated"
detail = """
Design § 5.4 rule 4 says the scan is linear because "each lookahead stops at the run's first digit or letter". On an all-letter run the first lookahead scans to the run's end and fails; linearity comes from the lookbehind, which allows one attempt per run, at its start. pi timed 16k and 32k letter and digit runs under OTP re at under 1 ms. Smallest fix: reword to "the lookbehind allows a match attempt only at a run's start, so each run is scanned once". VT-4's linear-time row stays.
"""
disposition = "fix-now"
response = 'Fixed in prose: design 5.4 rule 4 now attributes linearity to the lookbehind (one attempt per run). Operator agreed the recommended disposition ("agreed", 2026-10-29).'

