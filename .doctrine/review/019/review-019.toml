[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "DEC-041 rationale calls seen Jev's view; README omits that seen is un-stripped"
detail = """
DEC-041's rationale says the consumer's "invariant (agent view within Jev's view) holds by construction". seen is raw: it bounds the same window Jev's view was made from, but it holds text Jev never saw (addresses before stripping, queries, tokens, digit runs). The design § 1 wording ("what Jev's view was made from") is right; DEC-041 and a README reader can take seen as Jev's view and build the wrong guard. Also, the README classify / classify_state sections do not say seen is un-stripped mail on stdout (§ 5.6 points only at POL-002, a repo policy). Smallest fix: one README sentence under classify / mail-2 that seen is the un-stripped window state was stripped from, printed like read's output; reword DEC-041's rationale to "agent view within the window Jev's view was made from". Verified: record-041.toml:17.
"""
disposition = "fix-now"
response = """Fixed: DEC-041 rationale now reads the agent sees only the window Jev's view was made from, and notes seen itself is un-stripped. Design 5.2 README bullet states seen is the un-stripped window, printed like read's output. Operator agreed the recommended disposition ("agreed", 2026-10-29)."""

