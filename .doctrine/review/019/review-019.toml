[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "is_truncated: design § 5.3 and DEC-041 define it differently"
detail = '''
Design § 5.3 defines is_truncated = flagged by read, or cut on arrival, or cut here. DEC-041's choice says "true when the body's seen text is shorter than its input text or read flagged it". They disagree when control or bidi removal shrinks a text without a cut: "a\u0000b" gives seen "ab", design false, DEC-041 true. No VT covers this case. Smallest fix: pick one definition, state "control removal is not truncation" in § 5.3 if the design's wording wins, amend DEC-041 to match, add one VT-2 row. Verified: DEC-041 record-041.toml:15 wording.
'''
disposition = "fix-now"
response = 'Kept the design definition: control removal alone is not truncation (design 5.3). DEC-041 choice amended to read flagged by read, cut on arrival, or cut here including a spent budget. VT-2 gains a row: control removal alone leaves is_truncated false. Operator agreed the recommended disposition ("agreed", 2026-10-29).'

