[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Bounds bound seen, not state: strip can lengthen texts, VT-6 pins the wrong size"
detail = """
Design § 5.2 bounds, § 5.6 I2, § 9 VT-6, ASM-006. The bounds now apply to seen; pii.strip runs after the cut and can lengthen a text: each ? or # becomes ?[…] or #[…] (U+2026 is 3 bytes, so 1 byte becomes 6). pi measured a 16,379-byte body of "https://a? " units stripping to 23,824 bytes (+45%), so state bodies reach ~24.6 KB and a classify_state line ~98 KB, not "twice 45 KB". README:246 and :255-256 today say state.subject / attachment text are "at most" 512 / 128 bytes; that wording becomes false for state. ASM-006 validation_plan and VT-6 pin a size "computed from the bounds", which this growth can exceed, so VT-6 cannot catch it. Smallest fix: one sentence in § 5.2 that the table bounds seen and placeholders may lengthen state texts; VT-6 encodes a worst-case Window through encode(w, pii.strip) and pins that size. ASM-006's token margin (about 15k of 32k) appears to survive. Source: pi review run run-20261029T071255625Z-85-8abc2c96cef5; README lines verified by orchestrator, byte growth arithmetic checked (1 to 6 bytes per marker), measured figures are pi's.
"""
disposition = "fix-now"
response = 'Fixed in prose: design 5.2 states the bounds are on seen and placeholders may lengthen state texts; README Bounds bullet says classify_state adds state up to about 1.6 times seen; VT-6 now encodes a worst-case Window through pii.strip and pins that size. ASM-006 validation_plan updated to match; slice-005.md verification line updated. Operator agreed the recommended disposition ("agreed", 2026-10-29).'

