[[finding]]
id = "F-2"
status = "verified"
severity = "nit"
title = "Expected conformance to show only source paths; observed .doctrine lifecycle artefacts undeclared"
detail = """
Evidence: conformance lists .doctrine/review/011..013/* (incl. slug symlinks), .doctrine/slice/003/notes.md and .doctrine/slice/003/plan.toml as undeclared. These are the code-review ledgers, execution notes and plan, written by the lifecycle itself, not design targets. Precedent: RV-009 F-2 (SL-002) left `.doctrine/**` undeclared deliberately.
Question for disposition: selector gap, or tolerated non-source class."""
disposition = "tolerated"
response = 'Tolerated non-source class, not a selector gap. Rationale: review ledgers, notes.md and plan.toml are lifecycle bookkeeping that every slice writes; declaring them design-target would make "design-target" mean "anything the process touched" and dilute the undeclared signal for source. Same call as RV-009 F-2 for SL-002, so the two slices read alike. Conformance will keep listing `.doctrine/**` as undeclared; the synthesis records it.'

