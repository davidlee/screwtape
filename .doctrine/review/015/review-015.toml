[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = """Expected the design's "opaque cursor" to admit the future-date check it requires; observed § 4 and § 5.2 say never parse"""
detail = """Evidence: design § 4: "The cursor is opaque to consumers: they store and return it, never parse it." § 5.2 Published shape: `"cursor": str /* opaque */`. But § 5.2's README contract, Known limits, requires: "consumers must not store a cursor whose millisecond part is later than now plus a skew allowance" — which needs the consumer to read the millisecond part. README § Cursor (PHASE-06 D1) resolves it: opaque, "The one sanctioned look inside is the future-date check under Known limits." The design text contradicts itself and the README."""
disposition = "design-wrong"
response = "Agreed; README's wording is the right resolution and the design should say the same. Brief (Per-slice): design § 4 first bullet and the § 5.2 `cursor` comment / Cursor bullet state the one exception: a consumer may read the integer before the first `:` for DEC-028's future-date guard, and nothing else. See review-015.md § Reconciliation Brief, F-6."

