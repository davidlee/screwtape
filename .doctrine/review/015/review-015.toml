[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Expected DEC-028 to record the limits the design and README attribute to it; observed only the late-arrival limit"
detail = """
Evidence: design § 5.2 "Known limits (DEC-028)" lists four: older received_at entering the window; filters do not reopen passed positions; a future-dated received_at moves a cursor past later arrivals, with the consumer guard (do not store a cursor later than now + skew); the cursor is not scoped to an account. README § Contract Known limits states the same four. `doctrine show DEC-028` consequences hold only the first ("Misses mail that enters the window with an older received_at ... a consumer may re-scan a short overlap") and "A change cursor can be added later". The other three came from RV-010 after DEC-028 was accepted and were written into the design and README, not into the decision record. DEC-032 calls the cursor opaque and does not mention the guard either.
Inference: the accepted decision (tier-2 authority) is narrower than the contract that cites it, so a reader of DEC-028 alone misses the consumer obligation."""
disposition = "design-wrong"
response = "Agreed; the accepted decision should carry the consumer obligation the contract cites it for. Brief (Governance): DEC-028's consequences gain the three RV-010 limits (filters do not reopen passed positions; future-dated received_at, with the consumer guard as the one sanctioned read of the cursor; not scoped to an account). No choice changes, so this is an elaboration of the decision, not a new one. See review-015.md § Reconciliation Brief, F-9."

