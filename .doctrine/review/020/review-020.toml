[[finding]]
id = "F-7"
status = "verified"
severity = "nit"
title = "Control-only body: is_truncated depends on whether budget remains"
detail = """
Observed: a body whose text is only control characters prints `is_truncated: false` while budget remains (cleaned text empty, not cut) and `true` once the budget is spent (input non-empty). PHASE-02 pi review F5.
Checked against design § 5.3: "control removal alone is not truncation" and "Once the budget is spent ... is_truncated true when its input text was non-empty". Both rules are literal. README.md:263 now states the case.
"""
disposition = "aligned"
response = """
Both behaviours are the design's literal rules (§ 5.3) and README.md:263 documents the case. A control-only body carries no text either way; consumers lose nothing.
"""

