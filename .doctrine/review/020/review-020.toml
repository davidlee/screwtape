id = "F-1"
status = "verified"
severity = "major"
title = "Expected DEC-034 superseded and DEC-036/DEC-029 marked amended; observed DEC-034 still accepted with no relation"
detail = """
Expected: DEC-044 states "These records supersede DEC-034"; DEC-040 "amends DEC-036 and DEC-029" (design § 7).
Observed: `doctrine show DEC-034` → `accepted`, no supersede relation; DEC-036 and DEC-029 carry no relation to DEC-040. A reader of DEC-034 sees "strip first, cut after" and `sender_domains` as live governance.
"""
disposition = "design-wrong"
response = """
Governance lags the slice. Reconciliation Brief § Governance/spec: record `doctrine supersede DEC-044 DEC-034` (DEC-034 → superseded) and link DEC-040 → DEC-036, DEC-040 → DEC-029 as amends.
"""

