Observed: POL-002 Statement: "including its PII-stripped `classify --state` form". Since SL-005, both `classify` and `classify_state` lines carry `seen` (un-stripped window, design § 5.6), and `state` itself now keeps names, addresses and URL paths. Listed in slice-005.md Follow-Ups as a REV at reconcile.
