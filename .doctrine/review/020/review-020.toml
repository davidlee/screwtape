[[finding]]
id = "F-6"
status = "verified"
severity = "nit"
title = "Expected utf8.spend doc to hold for both callers; observed it describes only render's uncut-text use"
detail = """
Expected: the shared helper's doc is true for every caller.
Observed: `utf8.gleam:36-38`: "A codepoint dropped whole still spends the bytes reserved for it, so the next text does not see them." True for `render.read`, which passes the uncut text (size ≥ remaining → 0). False for `state.window_body`, which passes the seen text after prefix + word drop: leftover bytes do flow to the next body (design § 5.3 intends this: "charged the seen text's byte size"). Comment inherited from the old render-local `spend`.
"""
disposition = "fix-now"
response = """
Fixed in this audit: `utf8.gleam` doc now states the caller chooses what is charged (render: uncut text; state: kept text, leftover flows on). `nix develop -c just check` green, 629 tests.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

