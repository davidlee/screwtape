[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Delta-fold tests pass when created ids or earlier pages are discarded"
detail = """
Expected: PHASE-06 EX-1 and VT-2 (.doctrine/slice/002/plan.toml:167,175), backed by design § 5.4 (.doctrine/slice/002/design.md:430-440), require tests that distinguish accumulating created/updated/destroyed ids across pages from retaining only the last page, and that detect losing created ids altogether.

Observed: test/screwtape/sync_test.gleam:1452-1469 does not distinguish those implementations. On its first page, e1 is updated but destroyed on the last page, so losing the earlier update has no observable effect; e3 is created but is independently returned by Email/query and fetched as query_ids minus stored (src/screwtape/sync.gleam:118-130), so losing that created id also has no effect. All destruction is on the final page, so the test cannot establish destruction accumulation. The other creation case at test/screwtape/sync_test.gleam:1555-1558 also has an update and a destruction to force the query; there is no created-only delta to establish that a new arrival triggers it.

Verified by execution, not merely inferred survival: copied the source/tests/dependencies to /tmp/rv006-review-jcjw9pc2 (the three subject files byte-match commit 3db888e). Baseline just check passed all 421 tests. Independently changed src/screwtape/sync.gleam to (1) omit the page.created union at line 318, (2) replace delta.changed with set.new() at line 317, and (3) replace the cumulative destroyed union with set.from_list(page.destroyed) at line 320. Each mutant separately passed the entire gleam test suite: 421 passed, no failures, exit 0. Logs: ignore-created.log, forget-earlier-changed.log, forget-earlier-destroyed.log in that /tmp directory. The temporary source was restored byte-for-byte afterwards; repository source/tests were never edited.

Inferred consequence of the undetected regressions: a created-only arrival can be skipped while its cursor is committed; an earlier-page flag/membership update can be skipped; or an earlier-page deletion can leave a stale stored message. Advancing to the final newState means a later run need not report those changes again. RFC 8620 § 5.2 permits created/updated/destroyed changes split over intermediate states (https://www.rfc-editor.org/rfc/rfc8620.html#section-5.2).

Repair: extend the existing sync_fixture-based tests with a created-only arrival, an early-page update of a stored id that survives to a later empty page (assert its changed fields), and an early-page deletion followed by a page without that deletion (assert absence/backfill). A replayed created id already held from a prior fetch beyond its saved cursor is also a useful case. Demonstrate these cases kill the three mutants. This is a test-confidence defect; the current production fold at src/screwtape/sync.gleam:314-325 is correct."""
disposition = "fix-now"
response = """
Accepted on evidence: changes_pages_accumulate_and_destroyed_wins_test put every decisive change on the last page, and e3 entered via the query anyway, so the fold's accumulation was unpinned.

Fix (test/screwtape/sync_test.gleam, after the paging test):
- changes_on_an_earlier_page_count_test: page 1 updates e1 and destroys e2 (hasMoreChanges), page 2 reports nothing; asserts the light refresh of e1 under es-2 and e2 gone.
- created_only_runs_the_query_test: a created-only delta runs Email/query and fetches the arrival.

Negative controls (each applied alone to src/screwtape/sync.gleam, then restored byte-for-byte):
- ignore-created (drop the page.created union) -> created_only_runs_the_query_test fails;
- forget-earlier-changed (changed starts from set.new()) -> changes_on_an_earlier_page_count_test fails;
- forget-earlier-destroyed (destroyed = this page only) -> changes_on_an_earlier_page_count_test fails.
Suite 423 green; gleam format --check and just check clean.
Not taken: the "replayed created id already stored" case — it pins no distinct mutant of the fold (changed ∩ stored already covers it via the light refresh path).
"""

