[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "PHASE-03 VT-3 expected PASS; verify-vt reports FAIL (keyword opening_entries absent from jmap_fixture_test)"
detail = """
Expected: `doctrine slice verify-vt SL-002` passes every VT.
Observed: PHASE-03 VT-3 FAIL — "keyword `opening_entries` absent from `test/screwtape/jmap_fixture_test.gleam`"; rc=1. All 18 other VTs pass.
Evidence: the guard was factored into `jmap_fixture.opening_pairs` (test/support/jmap_fixture.gleam:383); `opening_entries` (:399) has no call-list parameter and asserts `Ok` from `opening_pairs`. The behaviour VT-3 names (a wrong-length pairing fails instead of truncating, in both directions) is tested at that seam: `opening_pairs_requires_one_argument_set_per_call_test` and `opening_pairs_test` (jmap_fixture_test.gleam:88, :100). The mandate's keyword names the wrapper, not the seam.
"""
disposition = "tolerated"
response = """
The behaviour VT-3 mandates is verified at the seam it was factored into (`opening_pairs`, both directions, plus order); `opening_entries` takes no call list, so a test "over a call list of the wrong length" cannot name it without being vacuous or a duplicate (design § 9 forbids both). The defect is the VT's keyword mandate, a plan criterion, which is off the reconcile surface (plan.toml criteria are immutable-append). Tolerated: verify-vt stays FAIL on this one VT with this rationale. Escalated to the operator: setting VT-3 `waived = true` (or appending a corrected VT) is a plan act, theirs to approve.
"""

