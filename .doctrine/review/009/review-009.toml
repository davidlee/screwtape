[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "I-M3 on fallback paths expected pinned (store the opening's Email state); observed a surviving mutant storing the Prior's state"
detail = """
Raised by the independent fresh-context reviewer; re-run by the audit in a scratch copy at df9e11a.
Expected: design § 5.3 / I-M3 — a full run stores the opening request's Email state; a test fails if a fallback run stores anything else.
Observed: `sync.reuse` (src/screwtape/sync.gleam:274-283) sets `email_state: opening_state`. Mutant `email_state: prior.email_state` → 430 passed, no failures.
Cause: every test opening answers Email state `es-0` (test/support/sync_fixture.gleam:120-122) and seeded Priors also hold `es-0`, so opening and Prior states are indistinguishable; `stored_email_state_test` (sync_test.gleam:1432) checks the full path only on the no-Prior seed.
Consequence (inferred): with that regression, a store that hit `cannotCalculateChanges` would keep the stale state and fall back on every run; incremental sync would never resume.
"""
disposition = "fix-now"
response = """
Fixed: `cannot_calculate_changes_falls_back_test` now opens with Email state `es-5` (distinct from the Prior's `es-0`) and asserts the stored Email type_state is `es-5`. Under the mutant (`email_state: prior.email_state` in `sync.reuse`) it fails (429/1); on the real code 430 pass. `reuse` serves all three Prior-keeping fallbacks, so one pin covers them.
"""

