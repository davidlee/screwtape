[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "I-M1 sync tests expected free of receivedAt ties (design § 8); observed every sync fixture shares one receivedAt, so deletion_backfills_test passes with destroyed ids ignored"
detail = """
Raised by the independent reviewer; re-run by the audit.
Expected: design § 8 risk table — "the tests avoid boundary ties except one that pins the local order"; § 9 names `deletion_backfills_test` as I-M1 evidence (the deletion causes the backfill).
Observed: `jmap_fixture.email` fixes `received_at: "2026-10-25T21:04:11Z"` (test/support/jmap_fixture.gleam:223); no sync test varies it, so the merge orders by the id tie-break. Mutant `gone: []` in `sync.incremental` (sync.gleam:293): `deletion_backfills_test` still passes (store [e1,e2] + fetched e3, keep 2 → [e3,e2] by id alone). The mutant is killed only by changes_pages_accumulate_and_destroyed_wins_test, changes_on_an_earlier_page_count_test, incremental_equals_full_test (427 passed, 3 failures).
Also: scripted server orders contradict the local order (incremental_equals_full_test pages [e4,e1,e3]; local order e4,e3,e1), passing only because keep retains all.
No surviving mutant suite-wide: the gap is the evidence a named I-M1 test claims, and a false design sentence.
"""
disposition = "fix-now"
response = """
Fixed (test evidence): new `sync_fixture.newest_first(ids)` builds `emails_of(ids)` a second apart, newest first, so the merge orders them as listed. `deletion_backfills_test` now makes e1 (the destroyed message) the newest; under the mutant `gone: []` it fails (now 4 tests kill it, was 3); on the real code 430 pass. The design sentence is wrong as written (sync fixtures do share one receivedAt; order is by the id tie-break): restate design § 8 risk-table row — Reconciliation Brief. The incremental_equals_full_test server/local order mismatch is harmless there (keep retains all) and left; future order-dependent tests use `newest_first`.
"""

