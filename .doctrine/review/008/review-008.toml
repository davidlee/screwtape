detail = """
Expected: the README names settings one way within a section; the options table and the new prose use the Home Manager names (`maxPages`, `maxTotalBytes`, `window.maxMessages`, `window.retainMessages`), and give the config-file name only where it is introduced explicitly (`retain_messages` "in the config").

Observed: the path diagram's second test reads `same server, account, max_body_bytes?` (config-file spelling), while the same section and the options table say `maxBodyBytes`.

Evidence: README.md ~102 (diagram) vs ~172 (`maxBodyBytes` row) and ~121 (`maxPages` prose).

Suggestion: write `maxBodyBytes` in the diagram (realign the arrow).
"""
disposition = "fix-now"
response = """
Fixed. README diagram now reads `maxBodyBytes`, matching the section and the options table.
"""

