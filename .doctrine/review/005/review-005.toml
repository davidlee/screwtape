[[review.turn]]
act = "conclude"
role = "raiser"
note = """
## Brief

Independent hostile design review of SL-002, facet design, acting only as the declared raiser. This brief is recorded in the conclude basis because the installed review CLI/MCP exposes no brief-writing verb, and the user restricts repository writes to review verbs. The companion Markdown Brief has not been edited directly.

Lines of attack: whether the incremental/full selection and shared retention merge satisfy the slice's guarantees; cache identity and immutable-body reuse; changes pagination and full fallback under finite budgets; concurrent server mutations and restart/replay; growth and supported configuration combinations; whether validation can detect the targeted failures; code-impact accuracy, diagrams and POL-001 reuse. The accepted service-only single-writer constraint and DEC-026's documented method-error budget undercount were treated as constraints, not reopened.

Read .doctrine/slice/002/design.md and the SL-002 scope; read DEC-024, DEC-025, DEC-026, EVD-001, POL-001, DEC-007, DEC-008 and ISS-001 through doctrine show. Checked the named sync/store/query/config/client/decode/normalise/import-check sources, plus model, request, CLI, Nix options and existing shared test fixtures/dump helpers. Consulted the shipped review-ledger guidance and the code-review/canon skills. Used the prior slice design only to confirm the settled concurrency boundary, not earlier SL-002 review material. Did not read .doctrine/slice/002/notes.md or .doctrine/slice/002/research/.

## Pass conclusion

Raised F-1 through F-6: 0 blocker, 5 major, 1 minor, 0 nit. Findings concern source identity, age-only retention semantics, budget-feasible fallback, the round-trip oracle, concurrent-server window equality, and the unchanged-run acceptance check. Each finding distinguishes verified source facts from inferred future M2 behaviour and gives evidence and a concrete repair.

Executed python /tmp/rv005-design-probes.py successfully. These are executable transcriptions/counterexamples to the written design and budget arithmetic, not implementation or integration tests. RFC identity/immutability semantics were checked against RFC 8620/8621. No repository build/test suite, live-account sync, credential access or production mutation was performed. The shared module/fetch/writer seams are appropriate under POL-001; no unsupported duplicate-implementation finding was manufactured.

This raiser pass is concluded. All six findings remain open for the responder; no finding was disposed or verified on the responder's behalf."""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-002"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Bind cached bodies to the JMAP source, not only account_id"
detail = """
Expected: a usable Prior identifies the same source account before immutable bodies can be reused. Observed: .doctrine/slice/002/design.md:209-217 omits source identity from Prior; :255-258 and :406-416 invalidate only on account_id/body-limit changes, retaining Prior even on cannotCalculateChanges. The fetched-id rule at :425-432 excludes every stored id, including on a full fallback. Current configuration accepts a configurable HTTPS session_url (src/screwtape/config.gleam:27-38, :115-118); the store already records api_url (src/screwtape/model.gleam:22-32; src/screwtape/store.gleam:253-264).

Counterexample (inference from the design, not a live server observation): change session_url from server A to server B while reusing the store. Both independently use account id 'acct', inbox id 'inbox', and Email id 'A'. B rejects A's cursor with cannotCalculateChanges. The prescribed full fallback queries ['A'], fetches no bodies because 'A' is stored, and light-refreshes only mailboxIds/keywords. The committed message keeps A's body, subject, blobId and receivedAt under B's account metadata. Future runs cannot repair immutable fields. RFC 8620 assigns ids on the server and scopes record uniqueness to type/account; it provides no cross-server namespace guarantee (https://www.rfc-editor.org/rfc/rfc8620.html#section-1.2 and #section-1.6.3). EVD-001 only probes one Fastmail source and cannot justify the wider identity assumption.

Repair: carry the already-stored source identity through Prior and discard Prior on a source change before either path reuses bodies; define which endpoint identity is compared. If source changes are deliberately unsupported, make that an enforced configuration/store constraint rather than silently reusing the cache. Extend shared fixtures with a two-source, colliding-id case asserting the second source's body replaces the first.

Reproduction: python /tmp/rv005-design-probes.py, source_change case at lines 31-38. This is an executable transcription of the proposed rules, not a test of unimplemented M2 code."""
disposition = "fix-now"
route = "review"
response = """
Observation verified: config.session_url is configurable (config.gleam:29, :115-118); the sync row stores api_url (model.gleam:22-32, store.gleam:253-264); design Prior omits it and usability checks only account_id and body limit. Ids are scoped per account per server (RFC 8620 §1.2), so a server change with a colliding account id would reuse foreign bodies. Repair: Prior carries the stored api_url; a Prior whose api_url differs from the session's apiUrl is unusable (no_state), alongside account_id and body limit. No new store column (api_url already written). One sync test: a Prior with another api_url refetches everything. The two-source colliding-id fixture the raiser proposes reduces to that test.
"""

