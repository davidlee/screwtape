[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Replay safety does not prove window equality for a run with concurrent mailbox changes"
detail = """
Expected: the design distinguishes a stable-server equality guarantee from eventual repair of changes that occur during a run. Observed: .doctrine/slice/002/design.md:455-462 promises window agreement after any committed run and says querying on any change proves it. But the sequence at :387-391 obtains changes first, then membership, then metadata; the incremental refresh set at :425-432 includes only stored ids reported by those earlier changes. The merge at :321-328 has no query-id input and can retain stale mailbox membership ahead of a newly fetched query result. I-M3 (:465-471) provides next-run replay, not current-run agreement.

Counterexample (inference, no overlapping local writers required): stored [A,B], newest first, max_messages=2. Email/changes completes at S1 reporting a flag change to A only. B then moves out of the configured mailbox. Email/query at S2 returns [A,C]; C is fully fetched and A is light-refreshed. B is not refreshed, so merge sees it still in Inbox, sorts [A,B,C], and keeps [A,B], discarding C. A fresh full sync against the now-stable S2 returns [A,C]. The committed Email cursor S1 correctly permits repair on the next run, but the advertised post-commit equality and 'server decides membership' explanation are false for this run. EVD-001's between-probe mailbox move does not establish a coherent view across these calls.

Repair: qualify I-M1 and DEC-025's proof with the necessary stable-state condition, and explicitly define next-run convergence under concurrent server mutations; if strict equality at commit is required, the design needs an actual coordination/validation mechanism. Add a scripted move after the last changes page but before query, assert the permitted first result and pre-change cursor, then assert the next run repairs membership without missing mail. The current static equality and token-value tests (:572-578) do not cover this case. Preserve DEC-008's settled service-only single-writer constraint; this finding concerns remote changes.

Reproduction: python /tmp/rv005-design-probes.py, concurrent_move case at lines 55-63; executable transcription of the design, not an M2 integration test."""
disposition = "design-wrong"
route = "review"
response = """
Observation verified: changes, then query, then gets are separate exchanges; a move after the last changes page leaves a stored message unrefreshed and the merge (no query-id input) can rank it above a newly fetched one. M1's full sync has the same non-atomic read across query and gets. Repair: I-M1 is stated for a server state that does not change during the run; under concurrent change it holds after the next run, because I-M3 stores a state that predates the change, which Email/changes then reports. No coordination mechanism (none exists in JMAP short of Email/queryChanges, out of scope). Evidence: one sync test, a move scripted between Email/changes and Email/query, asserting the stored Email state is the pre-move newState and that the next run converges to the full-sync ids.
"""

