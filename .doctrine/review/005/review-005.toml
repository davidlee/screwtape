[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Prior cannot support the promised identical full-store round trip"
detail = """
Expected: I-M5 is a meaningful check of the data actually read and reused by incremental sync. Observed: .doctrine/slice/002/design.md:475-477 and :579 require a snapshot rebuilt from query.prior to produce an identical store_dump. Prior at :209-217 contains only account_id, Email state, window_json, mailboxes, query and messages. It omits AccountMeta's synced_at/api_url/limits/is_read_only, non-Email type states, and all thread membership. Those are persisted by the unchanged writer (src/screwtape/store.gleam:209-250, :253-294); the normal Snapshot requires them (src/screwtape/model.gleam:22-46). In particular, thread_email can contain message ids outside the stored messages: test/support/snapshot_fixture.gleam:82-85 already exercises this.

Two stores differing only in an out-of-store thread member or synced_at project to the same Prior. No function of that Prior alone can reconstruct both original stores. Also store_dump compares every table in rowid order (test/support/store_dump.gleam:4-6, :100-118), whereas query.message canonicalises unordered relations (src/screwtape/store/query.gleam:75-78). Even a logically lossless read/rewrite can differ under this physical-order oracle. Reusing omitted values from the input fixture would make the advertised Prior reconstruction test circular.

Repair: narrow I-M5 to the persisted Message/QueryState values that Prior must preserve, comparing canonical logical values and explicitly declaring metadata/thread fields refreshed by a real run. Alternatively specify a complete read contract if whole-snapshot reconstruction is truly required. Extend the existing rich fixture, including its out-of-store thread member and scrambled relation order, rather than inventing a parallel harness (POL-001). The smaller message-round-trip assertion is sufficient for body reuse and avoids growing Prior just to satisfy an unnecessary test.

Verified by source inspection plus python /tmp/rv005-design-probes.py, round_trip case at lines 65-72 (information-loss model; not an M2 runtime test)."""
disposition = "design-wrong"
route = "review"
response = """
Observation verified: Prior (design § 5.2) omits AccountMeta, non-Email type states and thread membership; the fixture's thread names an out-of-store message (snapshot_fixture.gleam:82-85); store_dump compares rowid order while query.message canonicalises (query.gleam:75-78). A whole-store round trip from Prior is impossible and unnecessary. Repair: I-M5 narrowed to what body reuse needs: query.prior returns each stored message equal to its canonical form, plus the stored query record, mailboxes, Email state, window_json and api_url. Evidence: extend the existing read_queries_round_trip_every_fixture_message_test (store_test.gleam:706) to read through query.prior, not a new dump test (POL-001).
"""

