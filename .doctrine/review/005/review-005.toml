[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "The unchanged-run acceptance check conflates state probes, message gets and HTTP requests"
detail = """
Expected: the no-duplicate-fetch check measures nonempty body/metadata fetches and states how batching affects request count. Observed: .doctrine/slice/002/design.md:613-615 says the second live sync fetches no Email/get, but its explicitly unchanged opening request includes Email/get ids:[] (:41-43, :387; src/screwtape/jmap/request.gleam:186-198). A literal 'no Email/get' observation therefore cannot pass even for the intended correct run. The unconditional three-request statement at :397-400 is also only true when the retained threads fit one chunk (and at least one exists); get_threads already chunks by maxObjectsInGet (src/screwtape/sync.gleam:433-452, :489-505). The default max_messages=2000 (nix/module.nix:137-140), with 2000 distinct threads and chunk size 500, needs four Thread/get exchanges plus opening and changes, hence six exchanges after session discovery. Empty retention needs no final thread exchange.

The fixture records only each HTTP request's first method in Run.calls (test/support/sync_fixture.gleam:283-289, :338-342); expect_calls at :362-366 therefore cannot establish the absence of an Email/get hidden in a batched opening. Run.requests/opening_calls already provide the richer observation.

Repair: define 'no fetch' as no nonempty Email/get and no body-bearing get of stored ids, while explicitly permitting the empty opening state probe. State the cost as opening + changes pages + ceil(distinct retained threads / maxObjectsInGet), plus session discovery separately. Extend existing request/argument assertions with zero-, one- and multiple-thread-chunk cases; do not add another harness.

Verified by source inspection and request-count arithmetic in python /tmp/rv005-design-probes.py:77-83; no live account calls were made."""
disposition = "fix-now"
response = """
Partly accepted. Verified: the opening carries Email/get with ids [] (request.gleam:186-198), so "fetches no Email/get" is literally false, and Thread/get is chunked by maxObjectsInGet (sync.gleam:433-452), so "three requests" holds only for one thread chunk. Repair: prose states "no Email/get with ids beyond the opening's state probe" and the cost as opening + changes pages + ceil(distinct retained threads / maxObjectsInGet) Thread/get (none when nothing is retained). The unchanged-run test also checks run.requests so the opening's calls are pinned. Contested: new zero/one/many thread-chunk cases. Thread chunking is unchanged M1 code already covered by the chunking tests (sync_test.gleam:472, :530).
"""

