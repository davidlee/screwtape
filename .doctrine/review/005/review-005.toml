[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "The changes page cap does not ensure a budget-feasible fallback"
detail = """
Expected: the large-delta mitigation in .doctrine/slice/002/design.md:547 prevents a bulk update from wedging incremental sync by falling back to full. Observed: every successful changes page consumes the sole run budget (:81-82, :374-391); only cannotCalculateChanges or the page cap triggers fallback (:413-416). Other errors fail and retry from the unchanged cursor (:434-438). Current client code enforces the remaining budget before each call and charges successful responses (src/screwtape/jmap/client.gleam:141-156, :170-174); an oversized response becomes LimitExceeded(max_total_bytes) (:195-204). A finite number of ids per page is not a reservation of bytes for the full path.

Counterexample (inference, executable arithmetic): after session/opening, 500 bytes remain; each changes page costs 150 bytes; the full query/light/thread path costs 200 bytes. With max_pages=20, page four exceeds the remaining 50 bytes before the page-cap fallback can happen. With max_pages=3, fallback happens, but only 50 bytes remain and it still cannot finish. Every next run starts at the same committed cursor and repeats, although a full run alone fits the configured budget. This does not challenge DEC-026's explicitly accepted method-error undercount; the failure occurs on successful changes pages.

Repair: define a recovery policy that preserves a usable full-path budget or selects full before consuming it, with an explicit bound; alternatively acknowledge and provide a concrete operational recovery path for this unsupported condition instead of claiming the cap prevents the wedge. Test both exhaustion before the page cap and exhaustion after switching to full, over two attempts from the same seeded store. The current cases at :591-593 only assert fallback selection.

Reproduction: python /tmp/rv005-design-probes.py, budget cases at lines 40-53 and 73-75. This models the written flow and current client accounting; no live or M2 implementation run is claimed."""
disposition = "fix-now"
route = "review"
response = """
Observation verified in principle: client.exchange (client.gleam:141-156) refuses on an exhausted budget and successful changes pages are charged, so the page cap does not reserve budget for the full path; § 8 overclaims. Weight: a changes page is ids only; max_pages x maxChanges ids (defaults 20 x maxObjectsInGet) is on the order of hundreds of KB against a 256 MiB default budget, and the fallback full path fetches no stored bodies. A budget too small for that is a misconfiguration that already fails M1. Repair: no new mechanism. The design states the bound on changes-page cost, corrects the § 8 claim, and states the recovery: a run failing LimitExceeded leaves the store unchanged and fails again until max_total_bytes is raised, as in M1. The raiser's two-attempt exhaustion tests would pin M1's existing budget behaviour and are not added.
"""

