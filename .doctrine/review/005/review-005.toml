[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Age-only windows permit retention below the fetch window and repeated discarded body fetches"
detail = """
Expected: retention extends the fetch window, and DEC-025's window-agreement invariant has a defined meaning for every supported configuration. Observed: .doctrine/slice/002/design.md:193-197 compares retain_messages to max_messages only when both exist. Existing config explicitly permits max_age_days with max_messages absent (src/screwtape/config.gleam:102-108). The design queries the existing age-only window (:425-430), fetches all query ids absent from Prior, then trims the result to retain_messages (:300-328). I-M1 at :455-462 never defines its 'newest max_messages' comparison when max_messages is None.

Counterexample (inference, executable model): mailboxes=['inbox'], max_age_days=30, max_messages=null, retain_messages=2; three distinct-age messages A,B,C are all inside the age filter. Full selection and full body fetch are [A,B,C], but merge writes [A,B]. On every subsequent run with any Email change, query again returns [A,B,C], C's body is fetched and discarded again. At larger sizes this also spends the body budget on messages retention will never keep. This is more than the accepted receivedAt tie exception. DEC-024 allows the combination but does not settle this consequence; DEC-025's invariant cannot hold as written for it.

Repair: explicitly settle age-only fetch plus count-retention semantics. Either require a compatible count-bounded fetch window for explicit retention, or make the effective selection/count and the invariant agree without repeatedly fetching bodies solely to discard them. Reconcile DEC-024/DEC-025 if their stated contract changes. Add an age-only configuration case and two changed syncs checking both retained ids and full-get ids, rather than testing only positive values and the both-set comparison.

Reproduction: python /tmp/rv005-design-probes.py, age_only case at lines 24-29; an executable design model, not an M2 runtime test."""
disposition = "design-wrong"
route = "review"
response = """
Observation verified: validate (config.gleam:102-108) allows max_age_days without max_messages; DEC-024 compares retain_messages only when both are set, so an age-only window with retain_messages smaller than the window fetches bodies retention immediately discards, and I-M1's "newest max_messages" is undefined there. Repair (simplest): retain_messages requires max_messages (config error retain_without_max_messages); retention is a count extension of a count window. I-M1 restated for max_messages None without retention (all window-eligible messages). DEC-024 amended to record the requirement. Test: config rejects retain_messages without max_messages. The raiser's two-run age-only sync case is then unreachable and not added.
"""

