detail = """
opus round 3: introduced by DEC-016/ASM-005. Design 5.4 lists ProtectSystem=strict among the user unit's hardening and ASM-005 claims it runs under it; the earlier system-unit design confined writes to /var/lib/screwtape. In a systemd 262 user manager it does not confine writes to HOME or XDG_RUNTIME_DIR. Reproduction on this host (transient units via systemd-run --user, no secrets): with -p ProtectSystem=strict alone, and with PrivateTmp=yes added, touch under ~/.cache and under /run/user/1000 both succeed, while /var/tmp and /tmp are read-only; findmnt shows /home mounted rw inside the unit; uid_map 1000 1000 1 shows PrivateUsers was implied. man systemd.exec (Sandboxing preamble) says filesystem-namespacing settings need PrivateUsers in user services; ProtectSystem's own entry, unlike PrivateTmp and ProtectHome, makes no implicit-PrivateUsers statement. So the network-facing process that parses untrusted mail (HTML via htmgrrrl, JSON, the esqlite NIF) can read ~/.ssh, ~/Mail and ~/.config and write shell rc files or unit drop-ins. Under DEC-016 the process is trusted not to be malicious, but it consumes attacker-controlled input; the separate uid used to bound the blast radius of a parser bug and the redesign silently dropped that.
