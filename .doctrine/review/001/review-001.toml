response = """
Accepted. Design 5.2 now places max_body_size in the fourth httpc:request argument and the other options in the third, noting that a misplaced option is dropped and reported only to the silenced logger; the oversized-body controls fail if the cap is misplaced. jmap/client returns LimitExceeded without sending when the remaining budget is 0; design 9 adds that test (no request counted).
"""

