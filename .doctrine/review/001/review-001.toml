[[finding]]
id = "F-29"
status = "verified"
severity = "minor"
title = "httpc option placement and a zero remaining budget can silently disable or misreport the byte ceiling"
detail = """
opus round 3: adjacent to the F-12/F-19/F-20 repair. Evidence from OTP 28.5.0.8 inets-9.6.2.4 src/http_client/httpc.erl: max_body_size is validated in request_options_defaults (~line 1594), i.e. it belongs in httpc:request/4's fourth argument (Options); timeout, autoredirect, autoretry and ssl are in http_options (~lines 1490-1500), the third argument (HttpOptions). Both parsers silently drop an option they do not recognise or that fails validation, reporting only through error_logger:info_report (request_options/3 and http_options/3, ~lines 1400-1425 and 1604-1630). Main silences the logger before anything runs (design 5.2), so a misplaced max_body_size disables the byte ceiling with no trace. Design 5.2 calls all five 'the request options', which invites exactly that mistake. The transport proof in 9 would catch a misplaced max_body_size, which is good; a misplaced autoretry is caught by the 503 test.
Second, max_body_size is verified by VerifyIntegerNoLimit, which has clauses only for nolimit and integers > 0 (~line 1580). A zero remaining budget, reached when earlier responses consume max_total_bytes exactly, makes the next call raise function_clause inside request_options, so guard reports internal (exit 1) instead of Error.LimitExceeded("max_total_bytes"). Exit code is the same, the diagnostic is wrong, and it depends on an exception path the design otherwise reserves for bugs.
Repair: in 5.2 name which list each option goes in; have jmap/client return LimitExceeded when the remaining budget is 0 before calling Send (Send's contract: cap > 0); add a fixture_send case that spends the budget exactly and expects LimitExceeded on the next call without a request.
"""
