[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Position paging can duplicate ids and break the snapshot write"
detail = "Email/query pages by position. New mail arriving mid-sync shifts positions, so an id can appear on two pages; the INSERT then hits the message primary key and every busy sync fails with Store. Fix: deduplicate ids across pages before Email/get bookkeeping/snapshot; if queryState differs between pages, store query_state as absent so M2 falls back to a full resync."
disposition = "fix-now"
response = """
Route review (backfill). Superseded in substance by the F-10 and F-11 repairs: the seen-set and null query_state described in the original response are gone. Current design 5.2: phase 1 pages Email/query for ids only and must see one queryState across pages, restarting at most twice, else QueryUnstable with the store unchanged; phase 2 fetches each id exactly once. Duplicates cannot reach the snapshot write; I3 tests assert each id requested once on the recorded wire requests (design 9).
"""
