[[finding]]
id = "F-10"
status = "verified"
severity = "major"
title = "The F-2 fix cannot deduplicate Email/get ids before a paired server-side back-reference fetch"
detail = """
codex. Evidence: design.md §5.2 lines 403-413 sends Email/query and Email/get together with #ids pointing to /ids, while lines 431-433 promise repeats are removed before requesting them; §9 lines 814-815 requires each repeated id to be fetched once. RFC 8620 §3.7 resolves that reference on the server: https://www.rfc-editor.org/rfc/rfc8620.html#section-3.7 .

Verified structural contradiction: after a first page [A,B], a shifted second page [B,C] causes the already-submitted Email/get to fetch [B,C]. sync's seen-set can discard B only after this fetch. It cannot alter the reference to [C]. This challenges RV-001 F-2's chosen fix, rather than re-raising its original duplicate-primary-key defect. Duplicate inserts can be prevented, but the specified request behavior and its test cannot both be implemented.

Repair: choose one contract: separate query and get so the client can filter ids, or retain paired requests and explicitly deduplicate only normalization/insertion, accepting repeated body downloads and charging them to the byte budget. Position advancement must use raw query ids, while window accounting uses the chosen unique/successful-message count. Test the actual paired wire request, not a fake that performs client-side filtering between its two methods."""
