response = """
Route review (backfill; content unchanged). Separate requests: phase 1 pages Email/query ids only; phase 2 Email/get fetches each unique id once (design 5.2, 5.4 sequence). The wire-level test asserts each id requested once (design 9, I3). DEC-008 records it.
"""
