status = "verified"
severity = "major"
title = "Nulling a changed query_state commits an inconsistent query instead of recovering it"
detail = """
codex. Evidence: design.md §5.2 lines 434-439 explicitly accepts skipped messages during position paging and records null query_state when pages differ; §5.5 I3 promises exactly the window snapshot. RFC 8620 §5.5 requires refreshing the cached query or applying queryChanges after queryState changes: https://www.rfc-editor.org/rfc/rfc8620.html#section-5.5 .

Verified protocol conflict in the response to RV-001 F-2: persisting null is neither recovery operation. Inference from the specified algorithm: with results [A,B,C,D], page 1=[A,B], deletion of A, and page 2 at position 2=[D], the commit can retain A and omit C. The snapshot need never have existed upstream. Referring to M2 does not repair the M1 run, since M2 is not implemented. The earliest Email/get state is not a substitute for a consistent query-membership list.

Repair: on a changed queryState, restart/reconcile the id query within a bounded attempt/page budget, or fail without replacing the previous store when a coherent result cannot be obtained. Keep fetched immutable content cached if useful. Add a deletion-between-pages test that asserts recovery or rollback, not successful commitment of the mixed result."""
