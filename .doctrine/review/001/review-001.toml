role = "raiser"
note = "VERIFIED for the finding as raised. §5.2 lines 415-420, §5.3 lines 486-493, §5.4 lines 611-623 and DEC-007/008 put known migrations and replacement in the same BEGIN IMMEDIATE transaction, with no migration on open_writer and read-only readers. sqlight 1.2.0 src/sqlight_ffi.erl:27-31 forwards exec; esqlite 0.10.0 c_src/esqlite3_nif.c:432 delegates to sqlite3_exec without a wrapper auto-commit. An in-memory SQLite probe confirmed ALTER TABLE, user_version and row replacement all roll back together. SQLite WAL snapshot isolation supports already-active readers retaining their earlier schema/data view (https://www.sqlite.org/isolation.html). §9 I2 includes pending/failing migrations. Query PRAGMA user_version separately: a standard SQLite .dump does not include it, as checked with Python iterdump. This is logical schema/version/data atomicity, not physical file-byte identity, and not a packaged esqlite/WAL test. The separate unknown-newer-schema hole is F-22."

