act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted, keeping I2. Migrations run inside write_snapshot's transaction; open_writer does not migrate; open_reader is read-only and refuses no_snapshot or schema_mismatch (§5.2, §5.3, §5.4). Tests cover failure after a pending migration and migration rollback (§9 I2). DEC-007 updated."

