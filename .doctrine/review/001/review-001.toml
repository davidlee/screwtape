[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Crash reports can print the revealed token"
detail = "I1 assumes only explicit outputs leak. A panic (let assert, function_clause) in a frame holding the revealed bearer header, or an httpc worker crash, makes OTP logger print crash reports to stderr with arguments/state, including the Authorization header. Neither the Token closure nor the Error type prevents this. Fix: at startup set the OTP logger primary level to none (FFI); main rescues any exception and emits a generic internal error; no let assert on token-carrying paths; redaction tests add a forced-crash case inside the client."
disposition = "fix-now"
response = """
Route control (backfill; content unchanged). Design 5.2 crash containment: logger silenced (silence_logger/0), main under guard/1 emitting only a generic internal error, no let assert or panic in credential or jmap/client; erl_crash.dump and core dumps closed by ERL_CRASH_DUMP_SECONDS=0 and LimitCORE=0 (5.4, module-eval). Control: a sentinel token runs through each failure path and a crash forced inside the client, as a subprocess of the built shipment against local_jmap; the criterion asserts the sentinel is absent from stdout, stderr, inspected errors and the store dump. The incorrect candidate it must reject is a build without guard/1 or with the logger left at its default level, which prints the crashing frame. Host-phase constraint: the phase that introduces the client and credential carries this test, and no later phase may add a token-holding code path without extending it (design 9, I1).
"""
route = "control"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "§5.2 crash containment: logger silenced (silence_logger/0), main under guard/1 emitting a generic internal error, no let assert/panic in credential or jmap/client. Sibling sweep added erl_crash.dump and core dumps: ERL_CRASH_DUMP_SECONDS=0, LimitCORE=0 (§5.4, module-eval test). I1 extended; redaction tests add a forced crash (§9)."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED at design level. §5.2 lines 351-366 silences OTP logging before client work, guards cli.run with a generic error, forbids token-path panic/assert, and disables VM/core dumps through §5.4 lines 666-669. DEC-014 matches crash handling. §9 I1 adds shipment-subprocess sentinels, production transport and forced-crash coverage. This addresses the crash-report channel raised, not just explicit Error rendering. There is no implementation/runtime redaction proof yet; the new HTTP error-buffering defect is F-19, not evidence of a token leak."

