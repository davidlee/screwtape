[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "The response-byte ceiling is checked after the transport has buffered an unbounded body"
detail = """
codex. Evidence: design.md §5.2 lines 349-375 defines Send as returning Response(String), implements it with gleam_httpc, and places Budget in jmap/client; §8 line 769 claims max_total_bytes bounds memory. gleam_httpc 5.0.0 dispatch_bits (src/gleam/httpc.gleam lines 97-164) calls synchronous httpc:request and receives the complete binary body before returning; dispatch then converts it to String. Source: https://github.com/gleam-lang/httpc/blob/v5.0.0/src/gleam/httpc.gleam .

Verified by source inspection: jmap/client cannot inspect or cancel a response while Send is still receiving it. Inference: a large Email/get, Thread/get, error body or session response can exhaust memory before LimitExceeded is returned; even an honest multipart message can make a page much larger than expected. A fake Send returning a prebuilt oversized String only tests rejection after allocation.

Repair: put an incremental receive-and-cancel byte limit in the production transport, pass it the remaining aggregate budget (including the session and non-2xx responses), and test that a local oversized/chunked response is stopped while receiving it. If the existing library cannot expose that behavior, settle the transport seam before implementation; an additional systemd memory limit is containment, not proof of this application ceiling."""
disposition = "fix-now"
response = """
Accepted; the streaming transport is replaced. The production Send is now one synchronous httpc request passing max_body_size equal to the remaining budget. Verified by source inspection of OTP 28.5.0.8 inets 9.6.2.4: httpc_handler handle_http_body applies the check with no status condition (only 1xx, 204, 304 and HEAD skip it, and they carry no body); a Content-Length above the cap fails with body_too_big before the body is read (line 1014), and a chunked body fails at the first chunk header that would pass the cap (http_chunk.erl line 165). A close-delimited body is assumed unbounded and is contained by MemoryMax, stated as containment (design 5.2). Control: an oversized fixed-length 500 and an oversized chunked 500 from local_jmap, each with its terminal bytes withheld, must yield TooLarge while the server is still withholding; the concrete incorrect candidate the test must reject is an adapter that buffers the whole body before checking (plain gleam_httpc or async httpc without max_body_size). Host-phase constraint: the transport phase must pass this before any later phase relies on the byte ceiling (design 9, transport proof). The F-19 and F-20 dispositions carry the same criterion.
"""
route = "control"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted. The production Send is screwtape_http.erl over OTP httpc in streaming mode with cancel at the remaining budget, covering session and non-2xx bodies; gleam_httpc dropped. Test against local_jmap (inets on loopback) while streaming. MemoryMax= added as containment only (§5.2, §5.4, §8, §9 I4, §10). DEC-006 updated."

[[finding.turn]]
act = "contest"
role = "raiser"
note = "CONTEST. The promised pre-buffering bound is still false for error/redirect bodies: §5.2 lines 393-397 selects httpc streaming but claims it also covers non-2xx, whereas OTP streams only 200/206. A local OTP 28.5.0.8 chunked-500 probe delivered the completed 8192-byte body without any streaming callback. The immutable new defect and repair are F-19; default hidden 503 retries additionally violate aggregate accounting (F-20). Replacing gleam_httpc with async httpc does not by itself settle this finding. Supply a transport that demonstrably bounds all statuses/framing before receipt completes; if instrument-routed, state the assertion and require its host transport phase to pass before later phases rely on the ceiling."

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "control"
response = """
Accepted; the streaming transport is replaced. The production Send is now one synchronous httpc request passing max_body_size equal to the remaining budget. Verified by source inspection of OTP 28.5.0.8 inets 9.6.2.4: httpc_handler handle_http_body applies the check with no status condition (only 1xx, 204, 304 and HEAD skip it, and they carry no body); a Content-Length above the cap fails with body_too_big before the body is read (line 1014), and a chunked body fails at the first chunk header that would pass the cap (http_chunk.erl line 165). A close-delimited body is assumed unbounded and is contained by MemoryMax, stated as containment (design 5.2). Control: an oversized fixed-length 500 and an oversized chunked 500 from local_jmap, each with its terminal bytes withheld, must yield TooLarge while the server is still withholding; the concrete incorrect candidate the test must reject is an adapter that buffers the whole body before checking (plain gleam_httpc or async httpc without max_body_size). Host-phase constraint: the transport phase must pass this before any later phase relies on the byte ceiling (design 9, transport proof). The F-19 and F-20 dispositions carry the same criterion.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = """
opus round 3: VERIFIED. Checked against design.md 5.2 (production Send, lines 401-430) and 9 (transport proof), DEC-006, DEC-009, and OTP 28.5.0.8 inets-9.6.2.4 source read independently. httpc_handler.erl handle_http_body (lines ~965-1040): the only status-conditional clause is 204/304/1xx without chunking, plus HEAD; the general clause applies max_body_size for any other status. Identity framing compares Content-Length to the cap and answers body_too_big without waiting for the body (only bytes that arrived with the headers are held). Chunked framing calls http_chunk:decode with the cap; http_chunk.erl decode_size (~line 165) throws body_too_long when AccLength + ChunkSize exceeds it, at the chunk header. A response with no Content-Length gets the record default content-length "-1" (http_internal.hrl line 64), which passes the cap check, so the design is right to treat close-delimited bodies as unbounded and contained only by MemoryMax. The control (oversized fixed-length and chunked 500 with withheld tails; reject buffer-then-check) and the host-phase constraint are stated on the ledger and in design 9. Two adjacent defects in how the option is passed (option-list placement, and a zero remaining budget) are raised separately as a new minor finding; they do not undo this repair.
"""

