[[finding]]
id = "F-17"
status = "verified"
severity = "minor"
title = "Raw UTCDate text is not a chronological SQLite sort key when fractional seconds vary"
detail = """
codex. Evidence: design.md §5.3 lines 459-461 says JMAP UTC timestamps can be compared as text to order them correctly. RFC 8620 §1.4 permits nonzero fractional seconds and omits zero fractions: https://www.rfc-editor.org/rfc/rfc8620.html#section-1.4 .

Verified in-memory SQLite reproduction: insert 2026-10-26T00:00:00Z and 2026-10-26T00:00:00.500Z into a TEXT received_at column. ORDER BY received_at DESC puts the whole-second value first; WHERE received_at >= '2026-10-26T00:00:00Z' excludes the later .500Z value. Both strings are valid UTCDate values. Inference: list ordering and --since can be wrong at second/date boundaries if a real server returns fractional times; no claim is made that this account currently does so.

Repair: derive a chronological key or consistently normalize timestamp precision on ingestion and filter construction while preserving the required precision. Add mixed whole-second/fractional-second ordering and midnight-filter tests. Keeping a raw provenance string separately is compatible with this repair."""
disposition = "fix-now"
response = """
Resolved with an explicit narrower contract, recorded under F-23: ordering is epoch milliseconds then message id; sub-millisecond precision is not ordered, and design 5.3 states it with the reason (a mail list needs no finer order). Mixed whole and fractional second ordering, the midnight --since case, and a sub-millisecond tie broken by id are tested (design 9, normalise).
"""

