detail = "codex, round 2; challenges the new transport chosen for RV-001 F-12. Expected: design §5.2 lines 389-407 and DEC-006/009 bound every response body, including non-2xx, while it arrives. Observed: {sync,false} plus {stream,{self,once}} streams only status 200/206. OTP httpc_handler.erl stream/3 and start_stream/3 retain other bodies; the consumer receives a completed response. Primary API: https://www.erlang.org/doc/apps/inets/httpc.html#request/5 (stream option). Verified locally against OTP 28.5.0.8, inets 9.6.2.4: a synthetic loopback server sent an 8192-byte chunked HTTP 500 body, withheld the terminal chunk for 800 ms, then completed. The first client delivery was complete_status=500 body_bytes=8192 at 822 ms; there was no stream_start or incremental delivery. The intended 1024-byte application cap had no opportunity to cancel at the boundary. Source: /nix/store/fwsrdc9r0c7al8yrga9fj6jb4k7dni6s-erlang-28.5.0.8/lib/erlang/lib/inets-9.6.2.4/src/http_client/httpc_handler.erl:166-201,1486-1511,1544-1556. This was a synthetic OTP probe, not the unimplemented Screwtape FFI. Inference: an arbitrarily large 401/429/500 or disabled-redirect response can still exhaust memory before TooLarge. MemoryMax is containment, as the design correctly says. Repair: settle an all-status receive limit inside the actual transport. OTP max_body_size is a candidate only after checking the selected version's handling of fixed-length, chunked and close-delimited bodies; a Content-Length precheck alone is insufficient. Add production-adapter tests proving early rejection of oversized error and redirect bodies, not merely a 200 stream or a completed oversized String. Host this proof in the transport spike before any later phase relies on the byte ceiling."
