[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "maxBodyValueBytes bounds each part, while the slice promises a per-message body bound"
detail = """
codex. Evidence: SL-001 Scope & Objectives requires per-message body bytes; design.md §5.2 lines 241-246 configures max_body_bytes and lines 410-413 passes it directly as maxBodyValueBytes. §5.3 stores multiple body rows per message. RFC 8621 §4.2 applies maxBodyValueBytes to each EmailBodyValue, and §4.1.4 permits multiple textBody parts: https://www.rfc-editor.org/rfc/rfc8621.html#section-4.2 .

Verified counterexample with synthetic values: max_body_bytes=262144; one message with two selected parts of exactly 262144 bytes each satisfies the server limit with both isTruncated=false, but its combined body is 524288 bytes. The broader max_total_bytes ceiling does not enforce the promised per-message limit. This can arise in ordinary multipart/mixed mail, not just a malformed response.

Repair: distinguish a per-part fetch limit from an aggregate per-message body limit, and define whether exceeding the latter fails the run or truncates the normalized output with explicit metadata. Test multiple selected body parts whose individual sizes fit but whose sum exceeds the configured per-message bound, including converted HTML output. Renaming the current setting to a per-part limit alone would leave the slice's stated per-message requirement unmet."""
disposition = "fix-now"
response = """
Route control (backfill; content unchanged). max_body_bytes bounds stored body text per message, cumulative over parts after HTML conversion, enforced in normalise with UTF-8-safe byte cuts and truncated_by message_limit; still sent as maxBodyValueBytes (design 5.2, 5.5 I4 and edge case). Control: two parts that each fit but together exceed max_body_bytes, plain and HTML after conversion; the criterion asserts the second is cut at a UTF-8 boundary and marked message_limit. The incorrect candidate it must reject is per-part enforcement only (relying on maxBodyValueBytes), which stores both parts whole. Host-phase constraint: the normalise phase carries it (design 9, I4).
"""
route = "control"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted. max_body_bytes is now per message, cumulative over parts after HTML conversion, enforced in normalise with UTF-8-safe byte cuts and truncated_by=message_limit; still sent as maxBodyValueBytes (§5.2, §5.5 I4 and edge case, §9 I4 row). DEC-009 updated."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED. §5.2 lines 267-271 distinguishes the server's per-part fetch ceiling from aggregate stored bytes per message. §5.5 lines 733-738 specifies cumulative counting after HTML conversion, valid UTF-8 prefixes and metadata on subsequent parts. §9 I4 covers two individually fitting parts, including converted HTML. DEC-009 agrees. No normalization implementation was executed."

