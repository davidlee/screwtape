[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "Migrations commit before fetching, contradicting the unchanged-store guarantee on failed sync"
detail = """
codex. Evidence: design.md §5.3 lines 454-459 makes store.open apply migrations in its own transaction; §5.4's sequence opens/migrates before session discovery (lines 547-551). Lines 564-569 and I2 (lines 641-642) promise that failure before snapshot commit leaves every table unchanged. §9's atomicity test starts from an existing store but never specifies a pending migration.

Verified in-memory SQLite reproduction of this ordering: create populated schema v1; BEGIN; ALTER TABLE message ADD COLUMN preview TEXT; PRAGMA user_version=2; COMMIT; then simulate session failure. The SQL dump differs and user_version remains 2. Transactional migration protects against a failed migration, not against a later failed sync. A migration that rewrites rows makes the data-preservation impact more than a version-number change. The same store.open contract also leaves the depicted read-only CLI open underspecified.

Repair: define the migration boundary explicitly. To retain I2, fetch first and commit migrations and replacement together, with the necessary writer coordination; otherwise obtain agreement to narrow I2 to preservation of the last readable mail snapshot across a separately successful upgrade. Split read-only opens from writer/migration opens. Add failure-after-successful-migration and migration-failure rollback cases, including schema, user_version and prior mail data."""
disposition = "fix-now"
response = """
Route control (backfill; content unchanged, extended by F-22). Migrations run only inside write_snapshot's transaction; open_writer does not migrate; open_reader is read-only and refuses no_snapshot or schema_mismatch; the writer also refuses a newer user_version (design 5.2, 5.3, 5.4). Control: a store with a pending migration and a run that then fails before commit; the criterion asserts the store's .dump and PRAGMA user_version are unchanged, and a failing migration rolls back. The incorrect candidate it must reject is migrate-on-open (migrations committed before fetching), which leaves the schema advanced. Host-phase constraint: the store phase that introduces migrations carries it (design 9, I2).
"""
route = "control"

