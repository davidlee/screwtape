[[finding]]
id = "F-16"
status = "verified"
severity = "major"
title = "The promised invariant tests omit the deployed access boundary and allowed-call enforcement"
detail = """
codex. Evidence: design.md §5.5 line 636 says every I1-I7 invariant is enforced by tests. §9 lines 774-779 routes client tests through fake Send; lines 824-828 check redaction under that fake and a guarded exception; lines 833-837 only evaluate module settings. There is no negative test of operator-uid access, no wrapper/sudoers exercise, and no assertion that emitted/constructible API methods are exactly I6's four allowed methods.

Verified coverage gap: I2/I3 have snapshot tests and I4 has normalization tests. I1 has useful but partial sentinel coverage: the production httpc worker/logger path, provisioning and actual VM/core-dump behavior are bypassed. I5 relies on an asserted import boundary without an automated dependency check. I6's constructor boundary and I7's uid boundary have no named verification case. Module evaluation cannot prove effective filesystem permissions, sudo argument restrictions, rejection of alternate config, or authentication. The smtp/JMAP read-only acceptance check also cannot establish these local properties.

Repair: map each invariant to its actual evidence and distinguish static review, unit tests and deployed checks. Add structural allowed-method/dependency assertions, production-adapter subprocess redaction checks, and a NixOS VM or deployment test that a nonmember operator uid cannot directly open DB/WAL/SHM, cannot use sudo noninteractively without authorization, and can invoke only the sanctioned read commands/config. Existing approved timestamp-cache behavior should be tested as a documented exception, not silently mistaken for per-invocation authentication. Keep destructive crash probes synthetic and isolated."""
