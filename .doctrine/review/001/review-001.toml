[[finding]]
id = "F-15"
status = "verified"
severity = "major"
title = "WAL alone does not give a multi-query read command one consistent snapshot"
detail = """
codex. Evidence: design.md §5.2 describes read returning headers, addresses, bodies and provenance and thread returning membership plus message summaries; §5.3 normalizes these into separate tables. §5.5 lines 690-691 relies on WAL for concurrent readers. §5.4 specifies the writer transaction, but no transaction spans each read command, and §9 has no reader-across-commit case. SQLite explains that a WAL snapshot belongs to a read transaction: https://www.sqlite.org/isolation.html .

Verified in-memory SQLite reproduction of the permitted autocommit behavior: read the old subject from message; let another connection atomically replace message/body rows and commit; read body on the first connection. The assembled result is ('old subject', 'new body'). This reproduction demonstrates the transaction requirement; it is not a runtime test of an unimplemented Screwtape reader or WAL deployment. Inference: a normal implementation using separate store queries can produce mixed headers/body/provenance or incomplete thread output during a timer commit.

Repair: require a single explicit read transaction on one connection for all queries that assemble a CLI response (or one SQL statement that provides the same guarantee), ending before slow output. Add a deterministic test that pauses after the first query, commits a replacement on a second connection, resumes, and requires a wholly old or wholly new response."""
disposition = "fix-now"
response = """
Route control (backfill; content unchanged). Each read verb runs all its queries in one read transaction through store.read (design 5.2, 5.4); invariant I8. Control: read runs its first query, pauses on an injected hook while a second connection commits a new snapshot, then resumes; the criterion asserts its output is wholly from the old snapshot. The incorrect candidate it must reject is per-query autocommit reads under WAL, which mix snapshots. Host-phase constraint: the phase that introduces the read verbs carries it (design 9, I8).
"""
