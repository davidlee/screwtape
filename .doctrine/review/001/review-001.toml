Verified ordering counterexample from the specified lifecycle: run A fetches an older window and pauses before BEGIN; run B fetches a newer window, begins, commits and exits; A then begins without contention and successfully overwrites B. Even simultaneous attempts can both succeed if the first transaction completes inside 5 seconds. The oneshot prevents overlap between starts of that unit, not independent CLI processes. Inference: if the documented manual-sync path is usable, it can regress the store without any busy error. No concurrent Screwtape processes were launched.

