detail = "SL-004 run dr-01a181a1, revision 31, submission sl4-adv-attest. Agent declared 14 att-adv-* section attestations (reviewer adversarial) with a top-level acceptance whose basis cited RV-016, not the user. The engine also recorded act cpa-design-accepted with authority user and that basis. The user had NOT accepted the design. No verb retracts an act; it should go stale once the user's real review-disposed is recorded (acceptance binds disposition). Correct form for agent-lane attestations: omit top-level acceptance. Friction: an acceptance meant for one declaration silently became a user checkpoint act."

